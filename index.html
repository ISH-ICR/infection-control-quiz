<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>감염관리실 퀴즈</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .page {
      min-height: 100vh;
      padding: 30px 16px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 26px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d9dee8;
      border-radius: 10px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 14px 18px;
      background: #667eea;
      color: white;
      font-weight: 800;
      font-size: 16px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn.secondary {
      background: #eef1f7;
      color: #333;
    }

    .btn.success {
      background: #27ae60;
    }

    .login-box {
      max-width: 460px;
      margin: 80px auto;
    }

    .login-box h1 {
      text-align: center;
    }

    .code-input {
      text-align: center;
      font-size: 22px;
      letter-spacing: 5px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .quiz-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .progress {
      color: #777;
      font-size: 14px;
    }

    /* =========================
       시간 제한 표시
    ========================= */

    .timer {
      display: none;
      margin: 15px auto 20px;
      padding: 10px 16px;
      border-radius: 10px;
      background: #f1f3ff;
      color: #667eea;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      width: fit-content;
      min-width: 120px;
    }

    .timer.warning {
      background: #fff3cd;
      color: #d68910;
    }

    .timer.danger {
      background: #fee2e2;
      color: #dc2626;
    }

    .question-number {
      color: #667eea;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 22px;
      line-height: 1.55;
      font-weight: 800;
      margin-bottom: 24px;
      white-space: pre-wrap;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      width: 100%;
      padding: 16px;
      border: 2px solid #e0e4ec;
      border-radius: 13px;
      background: white;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: 0.15s;
    }

    .option:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .option.selected {
      border-color: #667eea;
      background: #f1f3ff;
    }

    .option-number {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      background: #eef1f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .option.selected .option-number {
      background: #667eea;
      color: white;
    }

    .option-text {
      flex: 1;
      line-height: 1.5;
      padding-top: 5px;
      word-break: keep-all;
    }

    .navigation {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .navigation button {
      flex: 1;
    }

    .result-score {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      margin: 20px 0;
    }

    .result-message {
      text-align: center;
      color: #666;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .result-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .result-box {
      background: #f7f8fa;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .result-box small {
      display: block;
      color: #777;
      margin-bottom: 6px;
    }

    .result-box strong {
      font-size: 22px;
    }

    .loading {
      text-align: center;
      padding: 50px 10px;
      color: #777;
    }

    .error {
      text-align: center;
      padding: 30px 10px;
      color: #c0392b;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      .page {
        padding: 18px 12px;
      }

      .card {
        padding: 20px;
      }

      .title {
        font-size: 25px;
      }

      .question-text {
        font-size: 19px;
      }

      .result-summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     시작 화면
========================= -->

<div id="startView" class="page">
  <div class="container">

    <div class="card login-box">

      <h1>감염관리실 퀴즈</h1>

      <p class="subtitle" style="text-align:center;">
        참여 코드를 입력해주세요.
      </p>

      <div class="field">
        <label>참여 코드</label>

        <input
          id="codeInput"
          class="code-input"
          type="text"
          maxlength="6"
          placeholder="예: ABC123"
        />
      </div>

      <button
        class="btn"
        onclick="findQuiz()"
      >
        퀴즈 시작
      </button>

    </div>

  </div>
</div>


<!-- =========================
     참가자 정보
========================= -->

<div id="infoView" class="page hidden">
  <div class="container">

    <div class="card">

      <h1 id="infoTitle">
        퀴즈
      </h1>

      <p class="subtitle">
        참가자 정보를 입력해주세요.
      </p>

      <div class="field">

        <label>이름</label>

        <input
          id="nameInput"
          type="text"
          placeholder="이름을 입력하세요."
        />

      </div>


      <div class="field">

        <label>소속</label>

        <input
          id="affiliationInput"
          type="text"
          placeholder="소속을 입력하세요."
        />

      </div>


      <button
        class="btn"
        onclick="startQuiz()"
      >
        퀴즈 시작
      </button>


      <!-- 참가자 정보 화면 뒤로가기 -->

      <button
        class="btn secondary"
        style="margin-top:10px;"
        onclick="backToStart()"
      >
        뒤로가기
      </button>

    </div>

  </div>
</div>


<!-- =========================
     퀴즈 화면
========================= -->

<div id="quizView" class="page hidden">

  <div class="container">

    <div class="card">

      <div class="quiz-header">

        <div
          id="quizTitle"
          class="quiz-title"
        >
          퀴즈
        </div>

        <div
          id="progress"
          class="progress"
        >
          1 / 1
        </div>

      </div>


      <!-- 시간 제한 표시 -->

      <div
        id="timer"
        class="timer"
      >
        남은 시간: 0초
      </div>


      <div
        id="questionNumber"
        class="question-number"
      >
        문제 1
      </div>


      <div
        id="questionText"
        class="question-text"
      ></div>


      <div
        id="options"
        class="options"
      ></div>


      <div class="navigation">

        <button
          id="prevButton"
          class="btn secondary"
          onclick="previousQuestion()"
        >
          이전
        </button>

        <button
          id="nextButton"
          class="btn"
          onclick="nextQuestion()"
        >
          다음
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =========================
     결과 화면
========================= -->

<div id="resultView" class="page hidden">

  <div class="container">

    <div class="card">

      <h1 style="text-align:center;">
        퀴즈 완료
      </h1>

      <div
        id="resultScore"
        class="result-score"
      >
        0점
      </div>


      <div
        id="resultMessage"
        class="result-message"
      ></div>


      <div class="result-summary">

        <div class="result-box">

          <small>정답</small>

          <strong id="resultCorrect">
            0
          </strong>

        </div>


        <div class="result-box">

          <small>전체 문제</small>

          <strong id="resultTotal">
            0
          </strong>

        </div>


        <div class="result-box">

          <small>점수</small>

          <strong id="resultScoreSmall">
            0
          </strong>

        </div>

      </div>


      <button
        class="btn"
        onclick="location.reload()"
      >
        처음으로
      </button>

    </div>

  </div>

</div>


<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  import {
    firebaseConfig
  } from "./firebase-config.js";


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);


  let session = null;

  let code = null;

  let currentQuestion = 0;

  let answers = {};

  let participantName = "";

  let participantAffiliation = "";


  /*
  =====================================================
  타이머 관련 변수
  =====================================================
  */

  let timerInterval = null;

  let timerRemaining = 0;


  const $ = (id) =>
    document.getElementById(id);


  function show(id) {
    $(id).classList.remove("hidden");
  }


  function hide(id) {
    $(id).classList.add("hidden");
  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
    URL에 ?code=ABC123 이 있는 경우
    자동으로 코드 입력
  */

  const urlParams =
    new URLSearchParams(
      location.search
    );


  const urlCode =
    urlParams.get("code");


  if (urlCode) {

    $("codeInput").value =
      urlCode.toUpperCase();

  }


  /*
    엔터키로 퀴즈 찾기
  */

  $("codeInput").addEventListener(
    "keydown",
    (event) => {

      if (event.key === "Enter") {
        findQuiz();
      }

    }
  );


  /*
  =====================================================
  시작 화면으로 돌아가기
  =====================================================
  */

  function backToStart() {

    stopTimer();

    hide("infoView");
    hide("quizView");
    hide("resultView");

    show("startView");

  }


  /*
  =====================================================
  타이머 정지
  =====================================================
  */

  function stopTimer() {

    if (timerInterval) {

      clearInterval(timerInterval);

      timerInterval = null;

    }

  }


  /*
  =====================================================
  현재 문제의 시간 제한 가져오기
  =====================================================

  관리자에서 나중에

  timeLimit: 30

  과 같이 저장하면 30초 제한으로 작동합니다.

  0, null, undefined, 빈 값이면
  시간 제한 없음으로 처리합니다.
  */

  function getQuestionTimeLimit(question) {

    if (!question) {
      return 0;
    }


    const value =
      Number(question.timeLimit);


    if (
      !Number.isFinite(value) ||
      value <= 0
    ) {

      return 0;

    }


    return Math.floor(value);

  }


  /*
  =====================================================
  타이머 표시
  =====================================================
  */

  function updateTimerDisplay() {

    const timer =
      $("timer");


    if (timerRemaining <= 0) {

      timer.textContent =
        "시간 종료";

      timer.classList.remove("warning");
      timer.classList.add("danger");

      return;

    }


    timer.textContent =
      `남은 시간: ${timerRemaining}초`;


    timer.classList.remove(
      "warning",
      "danger"
    );


    if (timerRemaining <= 5) {

      timer.classList.add("danger");

    } else if (
      timerRemaining <= 10
    ) {

      timer.classList.add("warning");

    }

  }


  /*
  =====================================================
  타이머 시작
  =====================================================
  */

  function startTimer(seconds) {

    stopTimer();


    const timer =
      $("timer");


    /*
      시간 제한 없음
    */

    if (
      !seconds ||
      seconds <= 0
    ) {

      timer.style.display =
        "none";

      return;

    }


    timerRemaining =
      seconds;


    timer.style.display =
      "block";


    updateTimerDisplay();


    timerInterval =
      setInterval(
        async () => {

          timerRemaining--;

          updateTimerDisplay();


          if (
            timerRemaining <= 0
          ) {

            stopTimer();


            /*
              시간 종료 후 자동 진행
            */

            await timeExpired();

          }

        },
        1000
      );

  }


  /*
  =====================================================
  시간 종료
  =====================================================
  */

  async function timeExpired() {

    const q =
      session.questions[currentQuestion];


    /*
      이미 답을 선택했다면
      그대로 유지하고 다음 문제로 이동합니다.
    */

    if (
      currentQuestion <
      session.questions.length - 1
    ) {

      currentQuestion++;

      renderQuestion();

      return;

    }


    /*
      마지막 문제라면 자동 제출
    */

    await submitQuiz();

  }


  /*
  =====================================================
  퀴즈 불러오기
  =====================================================
  */

  async function findQuiz() {

    code =
      $("codeInput")
        .value
        .trim()
        .toUpperCase();


    if (!code) {

      alert("참여 코드를 입력해주세요.");
      return;

    }


    try {

      const snap =
        await getDoc(
          doc(db, "sessions", code)
        );


      if (!snap.exists()) {

        alert(
          "해당 참여 코드의 퀴즈를 찾을 수 없습니다."
        );

        return;

      }


      session =
        snap.data();


      if (
        session.status !== "open"
      ) {

        alert(
          "현재 참여할 수 없는 퀴즈입니다."
        );

        return;

      }


      if (
        !Array.isArray(
          session.questions
        ) ||
        session.questions.length === 0
      ) {

        alert(
          "등록된 문제가 없습니다."
        );

        return;

      }


      $("infoTitle").textContent =
        session.title ||
        "감염관리실 퀴즈";


      hide("startView");
      show("infoView");


    } catch (error) {

      console.error(error);

      alert(
        "퀴즈를 불러오는 중 오류가 발생했습니다."
      );

    }

  }


  /*
  =====================================================
  참가자 정보 화면에서 뒤로가기
  =====================================================
  */

  function backToStart() {

    stopTimer();

    hide("infoView");
    hide("quizView");
    hide("resultView");

    show("startView");

  }


  /*
  =====================================================
  참가자 정보 입력 후 시작
  =====================================================
  */

  function startQuiz() {

    participantName =
      $("nameInput")
        .value
        .trim();


    participantAffiliation =
      $("affiliationInput")
        .value
        .trim();


    if (!participantName) {

      alert("이름을 입력해주세요.");
      return;

    }


    if (!participantAffiliation) {

      alert("소속을 입력해주세요.");
      return;

    }


    currentQuestion = 0;

    answers = {};


    $("quizTitle").textContent =
      session.title ||
      "감염관리실 퀴즈";


    hide("infoView");
    show("quizView");


    renderQuestion();

  }


  /*
  =====================================================
  문제 화면 표시
  =====================================================
  */

  function renderQuestion() {

    stopTimer();


    const questions =
      session.questions;


    const q =
      questions[currentQuestion];


    const total =
      questions.length;


    $("progress").textContent =
      `${currentQuestion + 1} / ${total}`;


    $("questionNumber").textContent =
      `문제 ${currentQuestion + 1}`;


    $("questionText").textContent =
      q.text || "";


    const optionsContainer =
      $("options");


    /*
      혹시 기존 데이터에 options가 없을 경우
      기존 correct 값을 이용할 수 있도록 처리
    */

    let options =
      Array.isArray(q.options)
        ? q.options
        : [];


    /*
      정상적인 새 데이터
    */

    if (options.length > 0) {

      optionsContainer.innerHTML =
        options.map(
          (option, index) => {

            const selected =
              answers[q.id] === option.id;


            return `

              <button
                type="button"
                class="option ${selected ? "selected" : ""}"
                data-option-id="${escapeHtml(option.id)}"
              >

                <span class="option-number">
                  ${index + 1}
                </span>

                <span class="option-text">
                  ${escapeHtml(option.text)}
                </span>

              </button>

            `;

          }
        ).join("");


      optionsContainer
        .querySelectorAll(".option")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              answers[q.id] =
                button.dataset.optionId;


              renderQuestion();

            }
          );

        });

    }


    /*
    =====================================================
    이전 버튼 처리
    =====================================================
    
    현재 문제에 시간 제한이 있으면
    이전 문제로 돌아갈 수 없습니다.

    시간 제한이 없는 문제라면
    이전 문제로 돌아갈 수 있습니다.
    */

    const currentTimeLimit =
      getQuestionTimeLimit(q);


    if (currentQuestion === 0) {

      $("prevButton").disabled = true;

      $("prevButton").textContent =
        "이전";

    } else if (
      currentTimeLimit > 0
    ) {

      $("prevButton").disabled = true;

      $("prevButton").textContent =
        "시간 제한 중";

    } else {

      $("prevButton").disabled = false;

      $("prevButton").textContent =
        "이전";

    }


    /*
    마지막 문제 버튼
    */

    if (
      currentQuestion ===
      total - 1
    ) {

      $("nextButton").textContent =
        "제출하기";

    } else {

      $("nextButton").textContent =
        "다음";

    }


    /*
    =====================================================
    타이머 시작
    =====================================================
    */

    startTimer(
      currentTimeLimit
    );

  }


  /*
  =====================================================
  이전 문제
  =====================================================
  */

  function previousQuestion() {

    if (currentQuestion <= 0) {
      return;
    }


    const current =
      session.questions[currentQuestion];


    /*
      현재 문제에 시간 제한이 있으면
      이전 문제로 이동할 수 없습니다.
    */

    const timeLimit =
      getQuestionTimeLimit(current);


    if (timeLimit > 0) {

      alert(
        "시간 제한이 설정된 문제에서는 이전 문제로 돌아갈 수 없습니다."
      );

      return;

    }


    stopTimer();


    currentQuestion--;

    renderQuestion();

  }


  /*
  =====================================================
  다음 문제 / 제출
  =====================================================
  */

  async function nextQuestion() {

    const q =
      session.questions[currentQuestion];


    /*
      답을 선택했는지 확인
    */

    if (!answers[q.id]) {

      alert("답을 선택해주세요.");
      return;

    }


    stopTimer();


    if (
      currentQuestion <
      session.questions.length - 1
    ) {

      currentQuestion++;

      renderQuestion();

      return;

    }


    /*
      마지막 문제
    */

    const confirmed =
      confirm(
        "답안을 제출하시겠습니까?"
      );


    if (!confirmed) {

      /*
        제출을 취소하면
        현재 문제의 타이머를 다시 시작합니다.
      */

      startTimer(
        getQuestionTimeLimit(q)
      );

      return;

    }


    await submitQuiz();

  }


  /*
  =====================================================
  채점
  =====================================================
  */

  async function submitQuiz() {

    stopTimer();


    let score = 0;

    let correctCount = 0;

    const total =
      session.questions.length;


    session.questions.forEach(
      q => {

        const selectedAnswer =
          answers[q.id];


        /*
          새로운 데이터 구조:
          answerId와 참가자 선택값을 비교
        */

        if (
          q.answerId &&
          selectedAnswer === q.answerId
        ) {

          correctCount++;

          score +=
            Number(q.points || 0);

          return;

        }


        /*
          혹시 예전 데이터가 남아 있는 경우
          correct 문자열과 비교할 수 있도록
          보조 처리
        */

        if (
          !q.answerId &&
          Array.isArray(q.options)
        ) {

          const selectedOption =
            q.options.find(
              option =>
                option.id === selectedAnswer
            );


          if (
            selectedOption &&
            selectedOption.text === q.correct
          ) {

            correctCount++;

            score +=
              Number(q.points || 0);

          }

        }

      }
    );


    /*
      결과 문서 ID 생성
    */

    const resultId =
      "participant_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2, 8);


    const result = {

      name:
        participantName,

      affiliation:
        participantAffiliation,

      score:
        score,

      correctCount:
        correctCount,

      total:
        total,

      answers:
        answers,

      submittedAt:
        new Date().toISOString()

    };


    try {

      await setDoc(
        doc(
          db,
          "sessions",
          code,
          "results",
          resultId
        ),
        result
      );


      showResult(
        score,
        correctCount,
        total
      );


    } catch (error) {

      console.error(error);

      alert(
        "결과 제출 중 오류가 발생했습니다."
      );

    }

  }


  /*
  =====================================================
  결과 표시
  =====================================================
  */

  function showResult(
    score,
    correctCount,
    total
  ) {

    stopTimer();


    hide("quizView");

    show("resultView");


    $("resultScore").textContent =
      `${score}점`;


    $("resultScoreSmall").textContent =
      `${score}`;


    $("resultCorrect").textContent =
      `${correctCount}`;


    $("resultTotal").textContent =
      `${total}`;


    let message = "";


    if (
      correctCount === total
    ) {

      message =
        "모든 문제를 맞혔습니다! 🎉";

    } else if (
      correctCount >= total * 0.8
    ) {

      message =
        "아주 잘하셨습니다!";

    } else if (
      correctCount >= total * 0.6
    ) {

      message =
        "잘하셨습니다. 조금만 더 복습해보세요.";

    } else {

      message =
        "문제를 다시 한번 복습해보세요.";

    }


    $("resultMessage").textContent =
      message;

  }


  /*
  =====================================================
  전역 함수 등록
  =====================================================
  */

  window.findQuiz =
    findQuiz;

  window.startQuiz =
    startQuiz;

  window.previousQuestion =
    previousQuestion;

  window.nextQuestion =
    nextQuestion;

  window.backToStart =
    backToStart;

</script>
