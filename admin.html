<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>격리주의 퀴즈 관리자</title><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

.ipg-root {
  --bg-deep: #071a26;
  --bg-panel: #0f2a3a;
  --bg-panel-raised: #14344768;
  --line: #1f4a5e;
  --mint: #3ddc97;
  --mint-dim: #2a9c6e;
  --amber: #ffb84c;
  --coral: #ff6b6b;
  --text-hi: #eaf4f4;
  --text-mid: #a9c4cc;
  --text-dim: #5f8894;
  --font-sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'IBM Plex Mono', 'Consolas', monospace;

  font-family: var(--font-sans);
  background: radial-gradient(ellipse at 50% -10%, #103244 0%, var(--bg-deep) 55%);
  color: var(--text-hi);
  min-height: 100%;
  padding: 28px 16px 40px;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
}
.ipg-root * { box-sizing: border-box; }

.ipg-shell { width: 100%; max-width: 640px; }

.ipg-frame {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(180deg, #0d2534 0%, #0a1f2c 100%);
  box-shadow: 0 0 0 1px rgba(61,220,151,0.04), 0 30px 60px -30px rgba(0,0,0,0.7);
  overflow: hidden;
  position: relative;
}

/* ---------- shared bits ---------- */
.hidden { display: none !important; }
.ipg-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--mint);
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}
.ipg-overlay { padding: 36px 26px 30px; text-align: center; }
.ipg-overlay h1 { font-size: 21px; line-height: 1.4; margin: 0 0 14px; font-weight: 700; color: var(--text-hi); }
.ipg-overlay p { font-size: 13.5px; line-height: 1.7; color: var(--text-mid); margin: 0 auto 24px; max-width: 440px; }
.ipg-btn {
  padding: 13px 30px; border-radius: 9px; border: none; background: var(--mint);
  color: #06251b; font-family: var(--font-sans); font-weight: 700; font-size: 14.5px; cursor: pointer;
}
.ipg-btn:hover { background: #4fe8a8; }
.ipg-btn:disabled { opacity: 0.4; cursor: default; }
.ipg-btn-ghost {
  padding: 12px 24px; border-radius: 9px; border: 1px solid var(--line); background: transparent;
  color: var(--text-hi); font-family: var(--font-sans); font-weight: 600; font-size: 13.5px; cursor: pointer;
}
.ipg-btn-ghost:hover { border-color: var(--mint-dim); color: var(--mint); }
.ipg-btn-block { width: 100%; }
.ipg-btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ipg-stack-btns { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }

.ipg-field { text-align: left; margin-bottom: 14px; }
.ipg-field label { display: block; font-size: 12px; color: var(--text-mid); margin-bottom: 6px; }
.ipg-input, .ipg-textarea, .ipg-select {
  width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: rgba(255,255,255,0.02); color: var(--text-hi); font-family: var(--font-sans); font-size: 14px;
}
.ipg-input:focus, .ipg-textarea:focus, .ipg-select:focus { outline: none; border-color: var(--mint-dim); }
.ipg-textarea { resize: vertical; min-height: 56px; line-height: 1.5; }
.ipg-code-input { text-align: center; font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.3em; text-transform: uppercase; }
.ipg-error-text { color: var(--coral); font-size: 12.5px; margin-top: 8px; min-height: 16px; }
.ipg-hint { font-size: 12px; color: var(--text-dim); margin-top: -6px; margin-bottom: 16px; }

/* code display */
.ipg-code-badge {
  font-family: var(--font-mono); font-size: 34px; font-weight: 700; letter-spacing: 0.28em;
  color: var(--mint); background: rgba(61,220,151,0.08); border: 1px dashed var(--mint-dim);
  border-radius: 10px; padding: 16px 10px; margin: 6px 0 16px; user-select: all;
}
.ipg-status-pill {
  display: inline-block; font-family: var(--font-mono); font-size: 11px; padding: 4px 10px;
  border-radius: 20px; border: 1px solid var(--line); color: var(--text-mid); margin-bottom: 16px;
}
.ipg-status-pill.open { color: var(--mint); border-color: var(--mint-dim); }
.ipg-status-pill.closed { color: var(--coral); border-color: var(--coral); }

/* header hud during quiz */
.ipg-hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.015); }
.ipg-hud-title { font-size: 12.5px; color: var(--text-mid); display: flex; flex-direction: column; gap: 2px; }
.ipg-hud-title b { font-size: 15px; color: var(--text-hi); font-weight: 600; }
.ipg-hud-stats { display: flex; align-items: center; gap: 18px; font-family: var(--font-mono); }
.ipg-stat { text-align: right; }
.ipg-stat-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.06em; }
.ipg-stat-value { font-size: 17px; font-weight: 600; color: var(--mint); }

.ipg-timer-track { height: 4px; background: #0a1f2c; position: relative; }
.ipg-timer-fill { height: 100%; width: 100%; background: var(--mint); transition: width 0.2s linear, background 0.4s ease; }

.ipg-stage { padding: 26px 22px 22px; min-height: 320px; position: relative; }
.ipg-progress { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-bottom: 14px; letter-spacing: 0.04em; }

.ipg-card { border: 1px solid var(--line); background: var(--bg-panel); border-radius: 10px; padding: 20px 20px 22px; position: relative; }
.ipg-card::before {
  content: "환자 상황"; position: absolute; top: -9px; left: 16px; background: var(--bg-deep);
  padding: 0 8px; font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.08em;
}
.ipg-card-text { font-size: 16px; line-height: 1.6; color: var(--text-hi); }
.ipg-question-label { margin: 20px 0 12px; font-size: 13px; color: var(--text-mid); }

.ipg-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .ipg-options { grid-template-columns: 1fr; } }
.ipg-opt {
  border: 1px solid var(--line); background: rgba(255,255,255,0.02); color: var(--text-hi);
  font-family: var(--font-sans); font-size: 14.5px; font-weight: 500; padding: 14px 14px; border-radius: 8px;
  cursor: pointer; text-align: left; transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.ipg-opt:hover:not(:disabled) { border-color: var(--mint-dim); background: rgba(61,220,151,0.06); }
.ipg-opt:active:not(:disabled) { transform: scale(0.98); }
.ipg-opt:disabled { cursor: default; }
.ipg-opt.correct { border-color: var(--mint); background: rgba(61,220,151,0.14); color: var(--mint); }
.ipg-opt.wrong { border-color: var(--coral); background: rgba(255,107,107,0.12); color: #ffb0b0; }
.ipg-opt.dim { opacity: 0.4; }

.ipg-feedback { margin-top: 18px; border-radius: 10px; padding: 15px 16px; border: 1px solid var(--line); background: var(--bg-panel-raised); display: none; }
.ipg-feedback.show { display: block; animation: ipgFadeUp 0.25s ease; }
.ipg-feedback-head { font-family: var(--font-mono); font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.ipg-feedback-head.ok { color: var(--mint); }
.ipg-feedback-head.no { color: var(--coral); }
.ipg-feedback-body { font-size: 13.5px; line-height: 1.6; color: var(--text-mid); }
.ipg-next-btn { margin-top: 14px; width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--mint); color: #06251b; font-family: var(--font-sans); font-weight: 700; font-size: 14px; cursor: pointer; }
.ipg-next-btn:hover { background: #4fe8a8; }
@keyframes ipgFadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.ipg-result-score { font-family: var(--font-mono); font-size: 44px; font-weight: 700; color: var(--mint); margin: 6px 0 2px; }
.ipg-result-sub { font-size: 13px; color: var(--text-mid); margin-bottom: 22px; }

.ipg-review { text-align: left; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-panel); padding: 14px 16px; margin-bottom: 22px; }
.ipg-review-title { font-size: 12px; color: var(--text-dim); letter-spacing: 0.05em; margin-bottom: 10px; font-family: var(--font-mono); }
.ipg-review-item { font-size: 13px; line-height: 1.6; color: var(--text-mid); padding: 8px 0; border-top: 1px solid var(--line); }
.ipg-review-item:first-child { border-top: none; }
.ipg-review-item .tag { color: var(--mint); font-family: var(--font-mono); font-size: 11.5px; }
.ipg-review-empty { font-size: 13px; color: var(--text-mid); text-align: center; padding: 6px 0; }

/* editor */
.ipg-editor-list { text-align: left; max-height: 420px; overflow-y: auto; padding-right: 4px; margin-bottom: 16px; }
.ipg-editor-card { border: 1px solid var(--line); background: var(--bg-panel); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.ipg-editor-card-head { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-bottom: 10px; letter-spacing: 0.05em; }
.ipg-editor-row { display: flex; gap: 10px; }
.ipg-editor-row .ipg-field { flex: 1; }
.ipg-points-input { width: 100%; }

/* leaderboard */
.ipg-lb-wrap { text-align: left; border: 1px solid var(--line); background: var(--bg-panel); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
.ipg-lb-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); font-size: 13.5px; }
.ipg-lb-row:first-child { border-top: none; }
.ipg-lb-rank { font-family: var(--font-mono); font-weight: 700; color: var(--mint); width: 26px; flex-shrink: 0; }
.ipg-lb-name { flex: 1; color: var(--text-hi); font-weight: 600; }
.ipg-lb-aff { font-size: 11.5px; color: var(--text-dim); }
.ipg-lb-score { font-family: var(--font-mono); color: var(--mint); font-weight: 700; }
.ipg-lb-empty { padding: 20px; text-align: center; color: var(--text-mid); font-size: 13px; }

.ipg-panel-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; color: var(--text-hi); }
.ipg-panel-sub { font-size: 12.5px; color: var(--text-mid); margin-bottom: 20px; }
</style></head><body><div class="ipg-root"><div class="ipg-shell"><div class="ipg-frame">
<div id="login" class="ipg-overlay"><div class="ipg-eyebrow">ADMIN</div><h1>관리자 접속</h1><input id="pw" type="password" class="ipg-input" placeholder="관리자 비밀번호"><div id="loginerr" class="ipg-error-text"></div><button class="ipg-btn ipg-btn-block" onclick="login()">접속</button></div>
<div id="home" class="ipg-overlay hidden"><div class="ipg-eyebrow">ADMIN DASHBOARD</div><h1>격리주의 퀴즈 관리</h1><div class="ipg-stack-btns"><button class="ipg-btn ipg-btn-block" onclick="createSession()">새 세션 만들기</button><input id="loadcode" class="ipg-input ipg-code-input" placeholder="ABC123"><button class="ipg-btn-ghost ipg-btn-block" onclick="loadSession()">기존 세션 불러오기</button></div></div>
<div id="dash" class="ipg-overlay hidden"><div class="ipg-eyebrow">ADMIN DASHBOARD</div><div id="status" class="ipg-status-pill"></div><p>참여 코드</p><div id="codebadge" class="ipg-code-badge"></div><div class="ipg-btn-row"><button id="toggle" class="ipg-btn" onclick="toggleStatus()"></button><button class="ipg-btn-ghost" onclick="copyLink()">참가 링크 복사</button><button class="ipg-btn-ghost" onclick="saveQuestions()">문제 저장</button></div><div class="ipg-editor-list" id="editor"></div><div class="ipg-panel-title" style="font-size:15px">실시간 리더보드</div><div id="leader" class="ipg-lb-wrap"><div class="ipg-lb-empty">아직 제출된 결과가 없습니다.</div></div><button class="ipg-btn-ghost" onclick="location.reload()">처음으로</button></div>
</div></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import {getFirestore,doc,getDoc,setDoc,collection,getDocs} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';import {firebaseConfig,ADMIN_PASSWORD} from './firebase-config.js';
const app=initializeApp(firebaseConfig),db=getFirestore(app);const CATS=["표준주의","접촉주의","비말주의","공기주의","접촉주의+비말주의","접촉주의+공기주의"];const DEFAULT_QUESTIONS = [
    { id:"q1", text:"68세 여성, 요양병원에서 전원. 창상배양 검사에서 MRSA(메티실린내성 황색포도알균)가 검출되었습니다.", correct:"접촉주의", explain:"MRSA 창상감염은 접촉을 통해 전파되므로 접촉주의를 적용합니다. 환자 처치 전후 장갑·가운을 착용하고, 가능하면 1인실 또는 코호트 격리를 시행합니다.", points:100 },
    { id:"q2", text:"55세 남성, 설사가 지속되며 대변검사에서 Clostridioides difficile 독소가 양성으로 확인되었습니다.", correct:"접촉주의", explain:"C. difficile은 아포를 형성해 알코올 손소독제로는 제거되지 않으므로, 접촉주의와 함께 비누와 물을 이용한 손위생을 반드시 병행해야 합니다.", points:100 },
    { id:"q3", text:"3세 남아, 어린이집 집단발생 상황에서 급성 위장관염으로 내원, 로타바이러스 항원 검사 양성입니다.", correct:"접촉주의", explain:"로타바이러스 장염은 분변-경구 경로 및 오염된 물품을 통한 접촉 전파가 주된 경로로, 접촉주의를 적용합니다.", points:100 },
    { id:"q4", text:"42세 남성, 전신에 심한 소양감을 동반한 발진이 있으며 옴(개선충) 진단을 받았습니다.", correct:"접촉주의", explain:"옴은 직접적인 피부 접촉으로 전파되므로 접촉주의가 필요하며, 침구·의류 관리 등 환경관리도 함께 이루어져야 합니다.", points:100 },
    { id:"q5", text:"60세 남성, 카바페넴내성장내세균속균종(CRE)이 소변배양에서 검출되었습니다.", correct:"접촉주의", explain:"다제내성균인 CRE는 의료기관 내 전파 위험이 높아 접촉주의를 적용하고, 코호트 격리 및 전용 물품 사용을 고려합니다.", points:100 },
    { id:"q6", text:"30세 여성, 기침과 콧물을 동반한 계절성 인플루엔자 A 양성 판정을 받았습니다.", correct:"비말주의", explain:"인플루엔자는 기침·재채기 시 발생하는 비말을 통해 전파되므로 비말주의를 적용하고, 환자와 1m 이상 거리를 유지하거나 마스크를 착용합니다.", points:100 },
    { id:"q7", text:"8세 여아, 발열과 함께 양측 이하선 부종이 있어 유행성이하선염(볼거리)으로 임상진단되었습니다.", correct:"비말주의", explain:"유행성이하선염은 비말을 통해 전파되므로 비말주의를 적용하며, 증상 발생 후 일정 기간 격리가 권장됩니다.", points:100 },
    { id:"q8", text:"생후 6주 영아, 발작성 기침이 있으며 백일해(Bordetella pertussis) PCR 검사가 양성입니다.", correct:"비말주의", explain:"백일해는 비말 전파 질환으로, 유효한 항생제 치료 시작 후 일정 시간이 지날 때까지 비말주의를 유지합니다.", points:100 },
    { id:"q9", text:"25세 남성, 두통·발열·경부강직을 주소로 내원, 뇌척수액 배양에서 Neisseria meningitidis가 확인되었습니다.", correct:"비말주의", explain:"세균성 수막알균 수막염은 비말 전파가 가능해 진단 후 최소 24시간 동안 비말주의를 적용합니다.", points:100 },
    { id:"q10", text:"45세 남성, 만성 기침과 객혈이 있으며 객담 항산균 도말검사에서 양성으로 활동성 폐결핵이 의심됩니다.", correct:"공기주의", explain:"활동성 폐결핵은 미세 비말핵을 통해 공기 중으로 전파될 수 있어 공기주의를 적용하고, 음압격리병실과 N95 이상의 호흡보호구가 필요합니다.", points:100 },
    { id:"q11", text:"4세 여아, 예방접종 미완료 상태로 발열 후 전신에 반점구진성 발진이 나타나 홍역이 의심됩니다.", correct:"공기주의", explain:"홍역은 전염력이 매우 강한 공기매개 질환으로, 발진 발생 전후 일정 기간 공기주의를 적용해야 합니다.", points:100 },
    { id:"q12", text:"6세 남아, 전신에 수포성 발진이 나타나 수두(Varicella)로 진단되었습니다.", correct:"접촉주의+공기주의", explain:"수두는 수포액과의 직접 접촉 및 공기 중 비말핵을 통해 모두 전파될 수 있어 접촉주의와 공기주의를 함께 적용합니다.", points:100 },
    { id:"q13", text:"70세 남성, 항암치료로 면역이 저하된 상태에서 전신에 파종성 대상포진이 발생했습니다.", correct:"접촉주의+공기주의", explain:"국소 대상포진과 달리 파종성 대상포진은 전신 병변으로 인해 수두와 유사하게 전파 위험이 높아지므로 접촉주의와 공기주의를 함께 적용합니다.", points:100 },
    { id:"q14", text:"50세 여성, 늑골 부위에 국소적인 대상포진 병변이 있으나 병변이 옷으로 완전히 덮여 있고 면역기능은 정상입니다.", correct:"표준주의", explain:"면역기능이 정상이고 병변이 완전히 덮여 있는 국소 대상포진은 표준주의만으로 충분하며, 별도의 추가 격리는 필요하지 않습니다.", points:100 },

let current=null,code=null,poll=null;const $=id=>document.getElementById(id),show=id=>$(id).classList.remove('hidden'),hide=id=>$(id).classList.add('hidden');function genCode(){return Array.from({length:6},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join('')}
window.login=()=>{if($('pw').value!==ADMIN_PASSWORD)return $('loginerr').textContent='비밀번호가 올바르지 않습니다.';hide('login');show('home')};
window.createSession=async()=>{code=genCode();current={code,status:'draft',questions:structuredClone(DEFAULT_QUESTIONS)};await setDoc(doc(db,'sessions',code),current);openDash()};
window.loadSession=async()=>{code=$('loadcode').value.trim().toUpperCase();const s=await getDoc(doc(db,'sessions',code));if(!s.exists())return alert('세션을 찾을 수 없습니다.');current=s.data();openDash()};
function openDash(){hide('home');show('dash');$('codebadge').textContent=code;renderEditor();renderStatus();refresh();clearInterval(poll);poll=setInterval(refresh,5000)}
function renderStatus(){const open=current.status==='open';$('status').textContent=open?'참여 진행 중':'준비/마감';$('status').className='ipg-status-pill '+(open?'open':'closed');$('toggle').textContent=open?'참여 마감하기':'참여 시작하기'}
window.toggleStatus=async()=>{current.status=current.status==='open'?'closed':'open';await setDoc(doc(db,'sessions',code),current);renderStatus()};
function renderEditor(){const e=$('editor');e.innerHTML='';current.questions.forEach((q,i)=>{const d=document.createElement('div');d.className='ipg-editor-card';d.innerHTML=`<div class="ipg-editor-card-head">CASE ${i+1}</div><div class="ipg-field"><label>환자 상황</label><textarea class="ipg-textarea" data-i="${i}" data-f="text">${q.text}</textarea></div><div class="ipg-field"><label>정답</label><select class="ipg-select" data-i="${i}" data-f="correct">${CATS.map(c=>`<option ${c===q.correct?'selected':''}>${c}</option>`).join('')}</select></div><div class="ipg-field"><label>배점</label><input class="ipg-input" type="number" data-i="${i}" data-f="points" value="${q.points}"></div><div class="ipg-field"><label>해설</label><textarea class="ipg-textarea" data-i="${i}" data-f="explain">${q.explain}</textarea></div>`;e.appendChild(d)})}
window.saveQuestions=async()=>{document.querySelectorAll('[data-f]').forEach(x=>{let q=current.questions[+x.dataset.i];q[x.dataset.f]=x.dataset.f==='points'?(+x.value||0):x.value});await setDoc(doc(db,'sessions',code),current);alert('저장되었습니다.')};
window.copyLink=async()=>{const u=new URL('index.html',location.href);u.searchParams.set('code',code);await navigator.clipboard.writeText(u.href);alert('참가 링크가 복사되었습니다.')};
async function refresh(){if(!code)return;const s=await getDocs(collection(db,'sessions',code,'results'));const rows=s.docs.map(d=>d.data()).sort((a,b)=>b.score-a.score||b.correctCount-a.correctCount);$('leader').innerHTML=rows.length?rows.map((r,i)=>`<div class="ipg-lb-row"><div class="ipg-lb-rank">${i+1}</div><div class="ipg-lb-name">${r.name}<div class="ipg-lb-aff">${r.affiliation||''}</div></div><div class="ipg-lb-score">${r.score}점 (${r.correctCount}/${r.total})</div></div>`).join(''):'<div class="ipg-lb-empty">아직 제출된 결과가 없습니다.</div>'}
</script></body></html>
