<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감염관리 퀴즈 관리자</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

.ipg-root {
  --bg-deep: #071a26;
  --bg-panel: #0f2a3a;
  --bg-panel-raised: #14344768;
  --line: #1f4a5e;
  --mint: #3ddc97;
  --mint-dim: #2a9c6e;
  --amber: #ffb84c;
  --coral: #ff6b6b;
  --text-hi: #eaf4f4;
  --text-mid: #a9c4cc;
  --text-dim: #5f8894;
  --font-sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'IBM Plex Mono', 'Consolas', monospace;

  font-family: var(--font-sans);
  background: radial-gradient(ellipse at 50% -10%, #103244 0%, var(--bg-deep) 55%);
  color: var(--text-hi);
  min-height: 100vh;
  padding: 28px 16px 40px;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
}

.ipg-root * { box-sizing: border-box; }

.ipg-shell {
  width: 100%;
  max-width: 720px;
}

.ipg-frame {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(180deg, #0d2534 0%, #0a1f2c 100%);
  box-shadow: 0 0 0 1px rgba(61,220,151,0.04),
              0 30px 60px -30px rgba(0,0,0,0.7);
  overflow: hidden;
  position: relative;
}

.hidden { display: none !important; }

.ipg-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--mint);
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}

.ipg-overlay {
  padding: 36px 26px 30px;
  text-align: center;
}

.ipg-overlay h1 {
  font-size: 21px;
  line-height: 1.4;
  margin: 0 0 14px;
  font-weight: 700;
  color: var(--text-hi);
}

.ipg-overlay p {
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--text-mid);
  margin: 0 auto 24px;
  max-width: 520px;
}

.ipg-btn {
  padding: 13px 30px;
  border-radius: 9px;
  border: none;
  background: var(--mint);
  color: #06251b;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 14.5px;
  cursor: pointer;
}

.ipg-btn:hover { background: #4fe8a8; }

.ipg-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.ipg-btn-ghost {
  padding: 12px 24px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text-hi);
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
}

.ipg-btn-ghost:hover {
  border-color: var(--mint-dim);
  color: var(--mint);
}

.ipg-btn-danger {
  padding: 9px 13px;
  border-radius: 7px;
  border: 1px solid rgba(255,107,107,0.5);
  background: transparent;
  color: var(--coral);
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
}

.ipg-btn-danger:hover {
  background: rgba(255,107,107,0.1);
}

.ipg-btn-small {
  padding: 9px 13px;
  border-radius: 7px;
  font-size: 12px;
}

.ipg-btn-block { width: 100%; }

.ipg-btn-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

.ipg-stack-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 420px;
  margin: 0 auto;
}

.ipg-field {
  text-align: left;
  margin-bottom: 14px;
}

.ipg-field label {
  display: block;
  font-size: 12px;
  color: var(--text-mid);
  margin-bottom: 6px;
}

.ipg-input,
.ipg-textarea,
.ipg-select {
  width: 100%;
  padding: 11px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.02);
  color: var(--text-hi);
  font-family: var(--font-sans);
  font-size: 14px;
}

.ipg-input:focus,
.ipg-textarea:focus,
.ipg-select:focus {
  outline: none;
  border-color: var(--mint-dim);
}

.ipg-textarea {
  resize: vertical;
  min-height: 70px;
  line-height: 1.5;
}

.ipg-code-input {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 22px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
}

.ipg-error-text {
  color: var(--coral);
  font-size: 12.5px;
  margin-top: 8px;
  min-height: 16px;
}

.ipg-hint {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: -6px;
  margin-bottom: 16px;
}

.ipg-code-badge {
  font-family: var(--font-mono);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 0.28em;
  color: var(--mint);
  background: rgba(61,220,151,0.08);
  border: 1px dashed var(--mint-dim);
  border-radius: 10px;
  padding: 16px 10px;
  margin: 6px 0 16px;
  user-select: all;
}

.ipg-status-pill {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--line);
  color: var(--text-mid);
  margin-bottom: 16px;
}

.ipg-status-pill.open {
  color: var(--mint);
  border-color: var(--mint-dim);
}

.ipg-status-pill.closed {
  color: var(--coral);
  border-color: var(--coral);
}

/* 세션 목록 */
.ipg-section-title {
  text-align: left;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-hi);
  margin: 28px 0 10px;
}

.ipg-session-list {
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 18px;
}

.ipg-session-item {
  padding: 14px 15px;
  border-top: 1px solid var(--line);
  background: rgba(255,255,255,0.015);
}

.ipg-session-item:first-child {
  border-top: none;
}

.ipg-session-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-hi);
  margin-bottom: 6px;
}

.ipg-session-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.ipg-session-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.ipg-session-empty {
  padding: 20px;
  text-align: center;
  color: var(--text-mid);
  font-size: 13px;
}

/* 세션 제목 */
.ipg-current-title {
  font-size: 19px;
  font-weight: 700;
  color: var(--text-hi);
  margin-bottom: 5px;
}

.ipg-current-sub {
  font-size: 12px;
  color: var(--text-mid);
  margin-bottom: 12px;
}

/* editor */
.ipg-editor-list {
  text-align: left;
  max-height: 600px;
  overflow-y: auto;
  padding-right: 4px;
  margin: 20px 0 16px;
}

.ipg-editor-card {
  border: 1px solid var(--line);
  background: var(--bg-panel);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}

.ipg-editor-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 10px;
  letter-spacing: 0.05em;
}

.ipg-editor-card-head span {
  color: var(--mint);
}

.ipg-editor-row {
  display: flex;
  gap: 10px;
}

.ipg-editor-row .ipg-field {
  flex: 1;
}

.ipg-points-input {
  width: 100%;
}

/* leaderboard */
.ipg-lb-wrap {
  text-align: left;
  border: 1px solid var(--line);
  background: var(--bg-panel);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 18px;
}

.ipg-lb-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-top: 1px solid var(--line);
  font-size: 13.5px;
}

.ipg-lb-row:first-child {
  border-top: none;
}

.ipg-lb-rank {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--mint);
  width: 26px;
  flex-shrink: 0;
}

.ipg-lb-name {
  flex: 1;
  color: var(--text-hi);
  font-weight: 600;
}

.ipg-lb-aff {
  font-size: 11.5px;
  color: var(--text-dim);
}

.ipg-lb-score {
  font-family: var(--font-mono);
  color: var(--mint);
  font-weight: 700;
  white-space: nowrap;
}

.ipg-lb-empty {
  padding: 20px;
  text-align: center;
  color: var(--text-mid);
  font-size: 13px;
}

.ipg-panel-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
  color: var(--text-hi);
}

.ipg-panel-sub {
  font-size: 12.5px;
  color: var(--text-mid);
  margin-bottom: 20px;
}

.ipg-divider {
  height: 1px;
  background: var(--line);
  margin: 22px 0;
}

@media (max-width: 480px) {
  .ipg-overlay {
    padding: 28px 16px 24px;
  }

  .ipg-code-badge {
    font-size: 27px;
  }

  .ipg-editor-row {
    flex-direction: column;
    gap: 0;
  }

  .ipg-lb-row {
    align-items: flex-start;
  }

  .ipg-lb-score {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="ipg-root">
<div class="ipg-shell">
<div class="ipg-frame">

<!-- ==================== 로그인 ==================== -->
<div id="login" class="ipg-overlay">

  <div class="ipg-eyebrow">ADMIN</div>

  <h1>관리자 접속</h1>

  <input
    id="pw"
    type="password"
    class="ipg-input"
    placeholder="관리자 비밀번호"
    onkeydown="if(event.key==='Enter') login()"
  >

  <div id="loginerr" class="ipg-error-text"></div>

  <button
    class="ipg-btn ipg-btn-block"
    onclick="login()"
  >
    접속
  </button>

</div>


<!-- ==================== 관리자 홈 ==================== -->
<div id="home" class="ipg-overlay hidden">

  <div class="ipg-eyebrow">ADMIN DASHBOARD</div>

  <h1>격리주의 퀴즈 관리</h1>

  <div class="ipg-stack-btns">

    <button
      class="ipg-btn ipg-btn-block"
      onclick="createSession()"
    >
      새 세션 만들기
    </button>

  </div>


  <div class="ipg-section-title">
    기존 세션
  </div>

  <div id="sessionList" class="ipg-session-list">
    <div class="ipg-session-empty">
      세션 목록을 불러오는 중입니다.
    </div>
  </div>

  <button
    class="ipg-btn-ghost ipg-btn-block"
    onclick="loadSessions()"
  >
    세션 목록 새로고침
  </button>

</div>


<!-- ==================== 세션 관리 ==================== -->
<div id="dash" class="ipg-overlay hidden">

  <div class="ipg-eyebrow">ADMIN DASHBOARD</div>

  <div id="currentTitle" class="ipg-current-title">
    세션
  </div>

  <div id="currentTitleSub" class="ipg-current-sub"></div>

  <div id="status" class="ipg-status-pill"></div>

  <p>참여 코드</p>

  <div id="codebadge" class="ipg-code-badge"></div>

  <div class="ipg-btn-row">

    <button
      id="toggle"
      class="ipg-btn"
      onclick="toggleStatus()"
    ></button>

    <button
      class="ipg-btn-ghost"
      onclick="copyLink()"
    >
      참가 링크 복사
    </button>

    <button
      class="ipg-btn-ghost"
      onclick="saveQuestions()"
    >
      문제 저장
    </button>

    <button
      class="ipg-btn-ghost"
      onclick="downloadExcel()"
    >
      결과 Excel 다운로드
    </button>

  </div>


  <!-- 세션 기본 정보 -->
  <div class="ipg-divider"></div>

  <div class="ipg-section-title">
    세션 정보
  </div>

  <div class="ipg-field">
    <label>세션 제목</label>
    <input
      id="sessionTitle"
      class="ipg-input"
      placeholder="예: 2026년 9월 격리주의 교육"
    >
  </div>

  <button
    class="ipg-btn-ghost ipg-btn-block"
    onclick="saveSessionInfo()"
  >
    세션 제목 저장
  </button>


  <!-- 문제 편집 -->
  <div class="ipg-divider"></div>

  <div class="ipg-section-title">
    문제 관리
  </div>

  <div class="ipg-hint">
    문제는 원하는 만큼 추가하거나 삭제할 수 있습니다.
  </div>

  <div
    id="editor"
    class="ipg-editor-list"
  ></div>

  <div class="ipg-btn-row">

    <button
      class="ipg-btn"
      onclick="addQuestion()"
    >
      + 문제 추가
    </button>

    <button
      class="ipg-btn-ghost"
      onclick="saveQuestions()"
    >
      문제 저장
    </button>

  </div>


  <!-- 리더보드 -->
  <div class="ipg-divider"></div>

  <div class="ipg-panel-title">
    실시간 리더보드
  </div>

  <div class="ipg-panel-sub">
    제출 결과는 5초마다 자동으로 새로고침됩니다.
  </div>

  <div
    id="leader"
    class="ipg-lb-wrap"
  >
    <div class="ipg-lb-empty">
      아직 제출된 결과가 없습니다.
    </div>
  </div>

  <div class="ipg-btn-row">

    <button
      class="ipg-btn-ghost"
      onclick="refresh()"
    >
      결과 새로고침
    </button>

    <button
      class="ipg-btn-ghost"
      onclick="downloadExcel()"
    >
      Excel 백업
    </button>

  </div>


  <div class="ipg-divider"></div>

  <button
    class="ipg-btn-ghost ipg-btn-block"
    onclick="backHome()"
  >
    세션 목록으로
  </button>

</div>

</div>
</div>
</div>


<script type="module">

/* =========================================================
   Firebase
========================================================= */

import {
  initializeApp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

import {
  firebaseConfig,
  ADMIN_PASSWORD
} from './firebase-config.js';


/* Excel 생성용 SheetJS */
import * as XLSX
  from 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm';


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================================================
   기본 설정
========================================================= */

const CATS = [
  "표준주의",
  "접촉주의",
  "비말주의",
  "공기주의",
  "접촉주의+비말주의",
  "접촉주의+공기주의"
];


/* 기존 16문제 그대로 유지 */
const DEFAULT_QUESTIONS = [

  {
    id:"q1",
    text:"68세 여성, 요양병원에서 전원. 창상배양 검사에서 MRSA(메티실린내성 황색포도알균)가 검출되었습니다.",
    correct:"접촉주의",
    explain:"MRSA 창상감염은 접촉을 통해 전파되므로 접촉주의를 적용합니다. 환자 처치 전후 장갑·가운을 착용하고, 가능하면 1인실 또는 코호트 격리를 시행합니다.",
    points:100
  },

  {
    id:"q2",
    text:"55세 남성, 설사가 지속되며 대변검사에서 Clostridioides difficile 독소가 양성으로 확인되었습니다.",
    correct:"접촉주의",
    explain:"C. difficile은 아포를 형성해 알코올 손소독제로는 제거되지 않으므로, 접촉주의와 함께 비누와 물을 이용한 손위생을 반드시 병행해야 합니다.",
    points:100
  },

  {
    id:"q3",
    text:"3세 남아, 어린이집 집단발생 상황에서 급성 위장관염으로 내원, 로타바이러스 항원 검사 양성입니다.",
    correct:"접촉주의",
    explain:"로타바이러스 장염은 분변-경구 경로 및 오염된 물품을 통한 접촉 전파가 주된 경로로, 접촉주의를 적용합니다.",
    points:100
  },

  {
    id:"q4",
    text:"42세 남성, 전신에 심한 소양감을 동반한 발진이 있으며 옴(개선충) 진단을 받았습니다.",
    correct:"접촉주의",
    explain:"옴은 직접적인 피부 접촉으로 전파되므로 접촉주의가 필요하며, 침구·의류 관리 등 환경관리도 함께 이루어져야 합니다.",
    points:100
  },

  {
    id:"q5",
    text:"60세 남성, 카바페넴내성장내세균속균종(CRE)이 소변배양에서 검출되었습니다.",
    correct:"접촉주의",
    explain:"다제내성균인 CRE는 의료기관 내 전파 위험이 높아 접촉주의를 적용하고, 코호트 격리 및 전용 물품 사용을 고려합니다.",
    points:100
  },

  {
    id:"q6",
    text:"30세 여성, 기침과 콧물을 동반한 계절성 인플루엔자 A 양성 판정을 받았습니다.",
    correct:"비말주의",
    explain:"인플루엔자는 기침·재채기 시 발생하는 비말을 통해 전파되므로 비말주의를 적용하고, 환자와 1m 이상 거리를 유지하거나 마스크를 착용합니다.",
    points:100
  },

  {
    id:"q7",
    text:"8세 여아, 발열과 함께 양측 이하선 부종이 있어 유행성이하선염(볼거리)으로 임상진단되었습니다.",
    correct:"비말주의",
    explain:"유행성이하선염은 비말을 통해 전파되므로 비말주의를 적용하며, 증상 발생 후 일정 기간 격리가 권장됩니다.",
    points:100
  },

  {
    id:"q8",
    text:"생후 6주 영아, 발작성 기침이 있으며 백일해(Bordetella pertussis) PCR 검사가 양성입니다.",
    correct:"비말주의",
    explain:"백일해는 비말 전파 질환으로, 유효한 항생제 치료 시작 후 일정 시간이 지날 때까지 비말주의를 유지합니다.",
    points:100
  },

/* =========================================================
   상태
========================================================= */

let current = null;
let code = null;
let poll = null;
let currentResults = [];


/* =========================================================
   공통 함수
========================================================= */

const $ = id => document.getElementById(id);

const show = id => $(id).classList.remove('hidden');

const hide = id => $(id).classList.add('hidden');


function genCode() {

  return Array.from(
    {length:6},
    () => "ABCDEFGHJKMNPQRSTUVWXYZ23456789"[
      Math.floor(Math.random()*32)
    ]
  ).join('');

}


function newQuestionId() {

  return "q_" + Date.now() + "_" +
    Math.random().toString(36).slice(2,8);

}


/* HTML에 값을 넣을 때 안전하게 처리 */
function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   로그인
========================================================= */

window.login = () => {

  if ($('pw').value !== ADMIN_PASSWORD) {

    $('loginerr').textContent =
      '비밀번호가 올바르지 않습니다.';

    return;
  }

};


/* =========================================================

========================================================= */

window.createSession = async () => {

  const title = prompt(
    "새 세션의 제목을 입력해주세요.",
    "격리주의 교육"
  );

  if (title === null) return;

  code = genCode();

  current = {
    code: code,
    title: title.trim() || "격리주의 교육",
    status: "draft",
    questions: structuredClone(DEFAULT_QUESTIONS)
  };

  await setDoc(
    doc(db,'sessions',code),
    current
  );

  openDash();

};


/* =========================================================
   기존 세션 목록
========================================================= */

window.loadSessions = async () => {

  const box = $('sessionList');

  box.innerHTML =
    '<div class="ipg-session-empty">불러오는 중입니다...</div>';

  try {

    const snap = await getDocs(
      collection(db,'sessions')
    );

    if (snap.empty) {

      box.innerHTML =
        '<div class="ipg-session-empty">아직 만들어진 세션이 없습니다.</div>';

      return;
    }

    const sessions = snap.docs
      .map(d => d.data())
      .sort((a,b) => {

        const at = a.createdAt || "";
        const bt = b.createdAt || "";

        return String(bt).localeCompare(String(at));

      });


    box.innerHTML = sessions.map(s => {

      const sessionCode = escapeHtml(s.code || "");
      const title = escapeHtml(
        s.title || `기존 세션 (${s.code || "코드 없음"})`
      );

      const statusText =
        s.status === "open"
          ? "참여 진행 중"
          : "준비/마감";

      const statusClass =
        s.status === "open"
          ? "open"
          : "closed";

      const questionCount =
        Array.isArray(s.questions)
          ? s.questions.length
          : 0;

      return `
        <div class="ipg-session-item">

          <div class="ipg-session-title">
            ${title}
          </div>

          <div class="ipg-session-meta">
            ${sessionCode}
            ·
            ${statusText}
            ·
            문제 ${questionCount}개
          </div>

          <div class="ipg-session-actions">

            <button
              class="ipg-btn ipg-btn-small"
              onclick="openExistingSession('${sessionCode}')"
            >
              관리하기
            </button>

          </div>

        </div>
      `;

    }).join("");

  } catch (err) {

    console.error(err);

    box.innerHTML =
      '<div class="ipg-session-empty">세션 목록을 불러오지 못했습니다.</div>';

    alert(
      "세션 목록을 불러오지 못했습니다.\n\n" +
      "Firebase 설정 또는 Firestore 권한을 확인해주세요."
    );

  }

};


/* =========================================================
   기존 세션 열기
========================================================= */

window.openExistingSession = async (sessionCode) => {

  try {

    const s = await getDoc(
      doc(db,'sessions',sessionCode)
    );

    if (!s.exists()) {

      alert("세션을 찾을 수 없습니다.");

      await loadSessions();

      return;
    }

    code = sessionCode;

    current = s.data();

    /* 기존 세션에는 title이 없을 수 있음 */
    if (!current.title) {

      current.title =
        `기존 세션 (${current.code || code})`;

    }

    /* 기존 세션에 questions가 없을 경우 */
    if (!Array.isArray(current.questions)) {

      current.questions =
        structuredClone(DEFAULT_QUESTIONS);

    }

    openDash();

  } catch (err) {

    console.error(err);

    alert(
      "세션을 불러오는 중 오류가 발생했습니다."
    );

  }

};

  $('sessionTitle').value =

function renderEditor() {

  const e = $('editor');

  e.innerHTML = '';


  if (!Array.isArray(current.questions)) {

    current.questions = [];

  }


  if (current.questions.length === 0) {

    e.innerHTML = `
      <div class="ipg-session-empty">
        현재 문제가 없습니다.<br>
        아래의 "+ 문제 추가" 버튼을 눌러 문제를 추가해주세요.
      </div>
    `;

    return;

  }


  current.questions.forEach((q,i) => {

    const d = document.createElement('div');

    d.className =
      'ipg-editor-card';


    d.innerHTML = `

      <div class="ipg-editor-card-head">

        <span>CASE ${i+1}</span>

        <button
          class="ipg-btn-danger"
          data-delete="${i}"
        >
          문제 삭제
        </button>

      </div>


      <div class="ipg-field">

        <label>환자 상황</label>

        <textarea
          class="ipg-textarea"
          data-i="${i}"
          data-f="text"
        >${escapeHtml(q.text)}</textarea>

      </div>


      <div class="ipg-field">

        <label>정답</label>

        <select
          class="ipg-select"
          data-i="${i}"
          data-f="correct"
        >

          ${CATS.map(c => `
            <option
              value="${escapeHtml(c)}"
              ${c === q.correct ? 'selected' : ''}
            >
              ${escapeHtml(c)}
            </option>
          `).join('')}

        </select>

      </div>


      <div class="ipg-field">

        <label>배점</label>

        <input
          class="ipg-input ipg-points-input"
          type="number"
          min="0"
          data-i="${i}"
          data-f="points"
          value="${Number(q.points) || 0}"
        >

      </div>


      <div class="ipg-field">

        <label>해설</label>

        <textarea
          class="ipg-textarea"
          data-i="${i}"
          data-f="explain"
        >${escapeHtml(q.explain)}</textarea>

      </div>

    `;


    /* 삭제 버튼 */
    d.querySelector('[data-delete]')
      .addEventListener('click', () => {

        deleteQuestion(i);

      });


    e.appendChild(d);

  });

  current.questions.push({

    text: "",

function deleteQuestion(index) {

  const q =
    current.questions[index];

  const ok = confirm(
    `CASE ${index+1} 문제를 삭제할까요?\n\n` +
    `삭제 후에는 반드시 "문제 저장"을 눌러야 Firebase에 반영됩니다.`
  );

  if (!ok) return;

  current.questions.splice(
    index,
    1

  renderEditor();

}

window.saveQuestions = async () => {

  /* 화면에서 변경된 값 반영 */

  document
    .querySelectorAll('[data-f]')
    .forEach(x => {

      const i =
        Number(x.dataset.i);

      const field =
        x.dataset.f;

      const q =
        current.questions[i];

      if (!q) return;

      if (field === 'points') {

        q.points =
          Number(x.value) || 0;

      } else {

        q[field] =
          x.value;

      }

    });


  await setDoc(
    doc(db,'sessions',code),
    current
  );


  $('currentTitleSub').textContent =
    `참여 코드 ${code} · 문제 ${current.questions.length}개`;


  alert(
    `저장되었습니다.\n\n현재 문제 수: ${current.questions.length}개`
  );

};

async function getResults() {

  if (!code) return [];

  const s =
    await getDocs(
      collection(
        db,

        code,

}

/* =========================================================
   제출 시간 변환
========================================================= */

function formatDateTime(value) {

  if (!value) return "";


  try {

    /* Firebase Timestamp */
    if (
      typeof value === 'object' &&
      typeof value.toDate === 'function'
    ) {

      return value.toDate().toLocaleString(
        'ko-KR',
        {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        }
      );

    }


    /* ISO 문자열 등 */
    const d =
      new Date(value);

    if (!isNaN(d.getTime())) {

      return d.toLocaleString(
        'ko-KR',
        {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        }
      );

    }

  } catch (err) {

    console.warn(
      '날짜 변환 실패:',
      err
    );

  }


  return String(value);

}


/* =========================================================

window.downloadExcel = async () => {

  if (!code) return;


  try {

    const rows =
      await getResults();


    if (!rows.length) {

      alert(
        '다운로드할 제출 결과가 없습니다.'
      );

      return;

    }


    const title =
      current.title ||
      `격리주의 퀴즈_${code}`;


    /* Excel 데이터 */

    const excelData =
      rows.map((r,i) => {

        const submitted =
          r.submittedAt ||
          r.finishedAt ||
          r.completedAt ||
          r.timestamp ||
          "";


        return {

          "순위": i + 1,

          "이름":
            r.name || "",

          "소속":
            r.affiliation ||
            r.department ||
            "",

          "점수":
            Number(r.score) || 0,

          "정답 수":
            Number(r.correctCount) || 0,

          "총 문제 수":
            Number(r.total) ||
            current.questions.length,

          "제출 날짜/시간":
            formatDateTime(submitted)

        };

      });


    const worksheet =
      XLSX.utils.json_to_sheet(
        excelData
      );


    /* 열 너비 */

    worksheet["!cols"] = [

      {wch:8},
      {wch:18},
      {wch:22},
      {wch:10},
      {wch:12},
      {wch:14},
      {wch:24}

    ];


    const workbook =
      XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
      workbook,
      worksheet,
      "퀴즈 결과"
    );


    const safeTitle =
      title
        .replace(/[\\/:*?"<>|]/g,"_")
        .slice(0,50);


    const filename =
      `${safeTitle}_${code}_결과.xlsx`;


    XLSX.writeFile(
      workbook,
      filename
    );


  } catch (err) {

    console.error(err);

    alert(
      "Excel 파일을 만드는 중 오류가 발생했습니다.\n\n" +
      err.message
    );

  }

};

</script>

</body>
</html>
