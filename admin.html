<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>격리주의 퀴즈 관리자</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .page {
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .between {
      justify-content: space-between;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d9dee8;
      border-radius: 10px;
      padding: 11px 13px;
      background: white;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field {
      margin-bottom: 18px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      background: #667eea;
      color: white;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn.secondary {
      background: #eef1f7;
      color: #333;
    }

    .btn.danger {
      background: #e74c3c;
      color: white;
    }

    .btn.success {
      background: #27ae60;
      color: white;
    }

    .btn.small {
      padding: 8px 12px;
      font-size: 13px;
    }

    .login-box {
      max-width: 420px;
      margin: 100px auto;
    }

    .login-box h1 {
      text-align: center;
    }

    .session-list {
      display: grid;
      gap: 12px;
    }

    .session-item {
      border: 1px solid #e1e5ed;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .session-info strong {
      display: block;
      margin-bottom: 5px;
      font-size: 17px;
    }

    .session-meta {
      color: #777;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 5px;
    }

    .badge.open {
      background: #e8f8ef;
      color: #219653;
    }

    .badge.closed {
      background: #fcebea;
      color: #c0392b;
    }

    .badge.draft {
      background: #fff4dc;
      color: #a56a00;
    }

    .session-code {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 3px;
      margin: 8px 0;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .code-box {
      background: #f1f3ff;
      border-radius: 12px;
      padding: 15px 20px;
      text-align: center;
      min-width: 180px;
    }

    .code-box small {
      display: block;
      color: #777;
      margin-bottom: 5px;
    }

    .code-box strong {
      font-size: 28px;
      letter-spacing: 4px;
    }

    .question-card {
      border: 1px solid #e1e5ed;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .question-number {
      font-weight: 800;
      font-size: 18px;
    }

    .question-grid {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 15px;
    }

    .ipg-options-editor {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .ipg-option-editor {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ipg-option-number {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      border-radius: 50%;
      background: #eef1f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #555;
    }

    .ipg-option-input {
      flex: 1;
    }

    .ipg-option-delete {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: #fcebea;
      color: #c0392b;
      font-weight: 800;
    }

    .option-add-row {
      margin: 8px 0 16px;
    }

    .answer-title {
      font-size: 14px;
      font-weight: 700;
      margin: 14px 0 8px;
    }

    .ipg-answer-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .ipg-answer-item {
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #dfe3eb;
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
      background: #fafbfc;
    }

    .ipg-answer-item:has(input:checked) {
      border-color: #667eea;
      background: #f1f3ff;
    }

    .points-input {
      max-width: 150px;
    }

    .result-table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf0f4;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #f7f8fa;
      font-size: 13px;
    }

    .empty {
      padding: 40px 10px;
      text-align: center;
      color: #888;
    }

      margin-bottom: 20px;
    }

    .muted {
      color: #777;
      font-size: 13px;
    }

      .page {

      }

      }

      }

  </style>
</head>

<div id="loginView" class="page">

      </div>

    </div>
  </div>
</div>

    </div>

  </div>
</div>


<div id="dashboardView" class="page hidden">

          <small>참여 코드</small>
          <strong id="codeBoxValue"></strong>

          <div style="margin-top:10px;">

            </button>
          </div>
        </div>

      </div>
    </div>


    <div class="card">
      <div class="row between">
        <div>

          </div>
        </div>

        <button
          id="statusButton"
          class="btn success"
          onclick="toggleStatus()"

          퀴즈 열기
        </button>
      </div>

      <div style="height:15px;"></div>

      <div class="field">
        <label>퀴즈 제목</label>
        <input id="sessionTitleInput" type="text" />
      </div>

      <button class="btn" onclick="saveSessionInfo()">
        제목 저장
      </button>
    </div>


    <div class="card">
      <div class="row between">
        <div>
          <h2>문제 관리</h2>
          <div class="muted">
            보기 개수는 문제마다 자유롭게 설정할 수 있습니다.
          </div>
        </div>

        <button class="btn" onclick="addQuestion()">
          + 문제 추가
        </button>
      </div>

      <div style="height:20px;"></div>

      <div id="editor"></div>

      <div style="margin-top:20px;">
        <button class="btn" onclick="saveQuestions()">
          문제 전체 저장
        </button>
      </div>
    </div>


    <div class="card">
      <div class="row between">
        <div>

          </div>
        </div>

      </div>

      <div style="height:15px;"></div>

      <div id="resultsTable"></div>
    </div>

</div>

    {
      id: "q16",
      text: "감염관리에서 개인보호구는 환자와 상황에 따라 선택한다.",
      correct: "O",
      explain: "위험도와 노출 가능성을 고려하여 적절한 개인보호구를 선택합니다.",
      points: 100,
      options: [
        { id: "q16o1", text: "O" },
        { id: "q16o2", text: "X" }
      ],
      answerId: "q16o1"
    }

  ];


  let current = null;
  let code = null;
  let poll = null;
  let currentResults = [];


  const $ = (id) => document.getElementById(id);


  function show(id) {
    $(id).classList.remove("hidden");
  }


  function hide(id) {
    $(id).classList.add("hidden");
  }


  function genCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let result = "";

    for (let i = 0; i < 6; i++) {
      result += chars[Math.floor(Math.random() * chars.length)];
    }

    return result;
  }


  function newQuestionId() {
    return "q_" + Math.random().toString(36).slice(2, 10);
  }


  function newOptionId(questionId) {
    return questionId + "_o_" + Math.random().toString(36).slice(2, 9);
  }


  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function normalizeQuestion(q) {

    q = q || {};

    if (!q.id) {
      q.id = newQuestionId();
    }

    /*
      기존 데이터에 options가 없을 경우
      예전 CATS 값을 보기로 변환합니다.
    */
    if (!Array.isArray(q.options) || q.options.length < 2) {

      q.options = CATS.map((text, index) => ({
        id: newOptionId(q.id) + "_" + index,
        text
      }));

      let answerIndex = q.options.findIndex(
        option => option.text === q.correct
      );

      if (answerIndex < 0) {
        answerIndex = 0;
      }

      q.answerId = q.options[answerIndex].id;
    }

    q.options = q.options.map((option, index) => {

      if (!option || typeof option !== "object") {
        return {
          id: newOptionId(q.id),
          text: String(option ?? "")
        };
      }

      return {
        id: option.id || newOptionId(q.id),
        text: String(option.text ?? "")
      };

    });


    /*
      answerId가 없으면 기존 correct 값으로 정답을 찾습니다.
    */
    if (!q.answerId ||
        !q.options.some(option => option.id === q.answerId)) {

      const answerOption = q.options.find(
        option => option.text === q.correct
      );

      q.answerId =
        answerOption?.id ||
        q.options[0]?.id ||
        null;
    }


    /*
      기존 correct 필드도 유지합니다.
      다른 기존 코드와의 호환성을 위해 남겨둡니다.
    */
    const answerOption = q.options.find(
      option => option.id === q.answerId
    );

    q.correct = answerOption?.text || "";


    q.text = String(q.text ?? "");
    q.explain = String(q.explain ?? "");
    q.points = Number(q.points ?? 100);

    if (!Number.isFinite(q.points)) {
      q.points = 100;
    }

    return q;
  }


  function normalizeAllQuestions() {

    if (!current) return;

    if (!Array.isArray(current.questions)) {
      current.questions = [];
    }

    current.questions =
      current.questions.map(normalizeQuestion);
  }


  function login() {

    const password = $("passwordInput").value;

    if (password === ADMIN_PASSWORD) {

      localStorage.setItem(
        "quiz_admin_logged_in",
        "true"
      );

      hide("loginView");
      show("listView");

      loadSessions();

    } else {

      alert("비밀번호가 올바르지 않습니다.");

    }
  }


  $("passwordInput").addEventListener(
    "keydown",
    (e) => {

      if (e.key === "Enter") {
        login();
      }

    }
  );


  async function createSession() {

    const title = prompt(
      "새 퀴즈 제목을 입력하세요."
    );

    if (!title) return;

    const newCode = genCode();

    current = {
      code: newCode,
      title,
      status: "draft",
      createdAt: new Date().toISOString(),

      questions:
        structuredClone(DEFAULT_QUESTIONS)
    };

    code = newCode;

    normalizeAllQuestions();

    await setDoc(
      doc(db, "sessions", code),
      current
    );

    openDash();

  }


  async function loadSessions() {

    const snapshot =
      await getDocs(collection(db, "sessions"));

    const sessions = [];

    snapshot.forEach((docSnap) => {

      sessions.push(docSnap.data());

    });


    sessions.sort((a, b) => {

      const ad =
        new Date(a.createdAt || 0).getTime();

      const bd =
        new Date(b.createdAt || 0).getTime();

      return bd - ad;

    });


    const container = $("sessionList");

    if (sessions.length === 0) {

      container.innerHTML =
        `<div class="empty">아직 만들어진 퀴즈가 없습니다.</div>`;

      return;
    }


    container.innerHTML = sessions.map(session => {

      const statusClass =
        session.status === "open"
          ? "open"
          : session.status === "closed"
            ? "closed"
            : "draft";

      const statusText =
        session.status === "open"
          ? "진행 중"
          : session.status === "closed"
            ? "종료"
            : "준비 중";


      return `
        <div class="session-item">

          <div class="session-info">

            <strong>
              ${escapeHtml(session.title || "제목 없음")}

              <span class="badge ${statusClass}">
                ${statusText}
              </span>
            </strong>

            <div class="session-meta">
              코드: ${escapeHtml(session.code || "")}
              · 문제 ${session.questions?.length || 0}개
            </div>

          </div>

          <button
            class="btn small"
            data-code="${escapeHtml(session.code || "")}"
            onclick="openExistingSession(this.dataset.code)"
          >
            관리하기
          </button>

        </div>
      `;

    }).join("");

  }


  async function openExistingSession(sessionCode) {

    const snap =
      await getDoc(
        doc(db, "sessions", sessionCode)
      );


    if (!snap.exists()) {

      alert("퀴즈를 찾을 수 없습니다.");
      return;

    }


    current = snap.data();

    code = sessionCode;


    if (!current.title) {
      current.title = "격리주의 퀴즈";
    }


    if (!Array.isArray(current.questions)) {

      current.questions =
        structuredClone(DEFAULT_QUESTIONS);

    }


    normalizeAllQuestions();

    openDash();

  }


  function openDash() {

    hide("listView");
    hide("loginView");
    show("dashboardView");


    $("dashboardTitle").textContent =
      current.title || "퀴즈";

    $("dashboardCode").textContent =
      current.code || code;

    $("codeBoxValue").textContent =
      current.code || code;

    $("sessionTitleInput").value =
      current.title || "";


    renderStatus();
    renderEditor();

    refresh();


    if (poll) {
      clearInterval(poll);
    }

    poll = setInterval(
      refresh,
      5000
    );

  }


  function renderStatus() {

    const button = $("statusButton");

    if (current.status === "open") {

      button.textContent =
        "퀴즈 종료";

      button.className =
        "btn danger";

    } else {

      button.textContent =
        "퀴즈 열기";

      button.className =
        "btn success";

    }

  }


  async function toggleStatus() {

    if (!current) return;


    current.status =
      current.status === "open"
        ? "closed"
        : "open";


    await setDoc(
      doc(db, "sessions", code),
      current
    );


    renderStatus();

    loadSessions();

  }


  async function saveSessionInfo() {

    const title =
      $("sessionTitleInput").value.trim();


    if (!title) {

      alert("퀴즈 제목을 입력해주세요.");
      return;

    }


    current.title = title;


    await setDoc(
      doc(db, "sessions", code),
      current
    );


    $("dashboardTitle").textContent =
      title;


    alert("제목이 저장되었습니다.");

  }


  function renderEditor() {

    normalizeAllQuestions();

    const editor = $("editor");


    if (current.questions.length === 0) {

      editor.innerHTML =
        `<div class="empty">문제를 추가해주세요.</div>`;

      return;
    }


    editor.innerHTML =
      current.questions.map(
        (q, index) => {

          const optionsHtml =
            q.options.map(
              (option, optionIndex) => {

                return `
                  <div class="ipg-option-editor">

                    <div class="ipg-option-number">
                      ${optionIndex + 1}
                    </div>

                    <input
                      class="ipg-option-input"
                      data-qid="${escapeHtml(q.id)}"
                      data-oid="${escapeHtml(option.id)}"
                      value="${escapeHtml(option.text)}"
                      placeholder="보기 ${optionIndex + 1}"
                    />

                    <button
                      type="button"
                      class="ipg-option-delete"
                      data-qid="${escapeHtml(q.id)}"
                      data-oid="${escapeHtml(option.id)}"
                      onclick="deleteOptionFromQuestion(
                        this.dataset.qid,
                        this.dataset.oid
                      )"
                      title="보기 삭제"
                    >
                      ×
                    </button>

                  </div>
                `;

              }
            ).join("");


          const answerHtml =
            q.options.map(
              (option, optionIndex) => {

                return `
                  <label class="ipg-answer-item">

                    <input
                      type="radio"
                      name="answer_${escapeHtml(q.id)}"
                      value="${escapeHtml(option.id)}"
                      ${option.id === q.answerId ? "checked" : ""}
                      data-answer-qid="${escapeHtml(q.id)}"
                    />

                    ${optionIndex + 1}번
                  </label>
                `;

              }
            ).join("");


          return `

            <div
              class="question-card"
              data-question-id="${escapeHtml(q.id)}"
            >

              <div class="question-header">

                <div class="question-number">
                  문제 ${index + 1}
                </div>

                <button
                  class="btn danger small"
                  data-qid="${escapeHtml(q.id)}"
                  onclick="deleteQuestion(this.dataset.qid)"
                >
                  문제 삭제
                </button>

              </div>


              <div class="field">

                <label>문제 내용</label>

                <textarea
                  data-f="text"
                  data-qid="${escapeHtml(q.id)}"
                  placeholder="문제 내용을 입력하세요."
                >${escapeHtml(q.text)}</textarea>

              </div>


              <div class="field">

                <label>보기</label>

                <div class="ipg-options-editor">
                  ${optionsHtml}
                </div>

                <div class="option-add-row">

                  <button
                    type="button"
                    class="btn secondary small"
                    data-qid="${escapeHtml(q.id)}"
                    onclick="addOptionToQuestion(this.dataset.qid)"
                  >
                    + 보기 추가
                  </button>

                  <span class="muted">
                    최소 2개
                  </span>

                </div>


                <div class="answer-title">
                  정답 선택
                </div>

                <div class="ipg-answer-list">
                  ${answerHtml}
                </div>

              </div>


              <div class="question-grid">

                <div class="field">

                  <label>배점</label>

                  <input
                    class="points-input"
                    type="number"
                    min="0"
                    step="1"
                    data-f="points"
                    data-qid="${escapeHtml(q.id)}"
                    value="${escapeHtml(q.points)}"
                  />

                </div>

              </div>


              <div class="field">

                <label>해설</label>

                <textarea
                  data-f="explain"
                  data-qid="${escapeHtml(q.id)}"
                  placeholder="정답 해설을 입력하세요."
                >${escapeHtml(q.explain)}</textarea>

              </div>

            </div>

          `;

        }
      ).join("");

  }


  function addOptionToQuestion(questionId) {

    const q =
      current.questions.find(
        question => question.id === questionId
      );


    if (!q) return;


    q.options.push({

      id: newOptionId(questionId),

      text: ""

    });


    renderEditor();

  }


  function deleteOptionFromQuestion(
    questionId,
    optionId
  ) {

    const q =
      current.questions.find(
        question => question.id === questionId
      );


    if (!q) return;


    if (q.options.length <= 2) {

      alert("보기는 최소 2개가 필요합니다.");
      return;

    }


    const deletedWasAnswer =
      q.answerId === optionId;


    q.options =
      q.options.filter(
        option => option.id !== optionId
      );


    if (deletedWasAnswer) {

      q.answerId =
        q.options[0]?.id || null;

    }


    const answerOption =
      q.options.find(
        option => option.id === q.answerId
      );


    q.correct =
      answerOption?.text || "";


    renderEditor();

  }


  function updateCorrectText(q) {

    const answerOption =
      q.options.find(
        option => option.id === q.answerId
      );


    q.correct =
      answerOption?.text || "";

  }


  function addQuestion() {

    const id =
      newQuestionId();


    current.questions.push({

      id,

      text: "",

      options: [

        {
          id: newOptionId(id),
          text: ""
        },

        {
          id: newOptionId(id),
          text: ""
        },

        {
          id: newOptionId(id),
          text: ""
        },

        {
          id: newOptionId(id),
          text: ""
        }

      ],

      answerId: null,

      correct: "",

      points: 100,

      explain: ""

    });


    normalizeQuestion(
      current.questions[
        current.questions.length - 1
      ]
    );


    renderEditor();


    setTimeout(() => {

      const cards =
        document.querySelectorAll(
          ".question-card"
        );

      cards[cards.length - 1]
        ?.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

    }, 100);

  }


  function deleteQuestion(questionId) {

    if (!confirm("이 문제를 삭제할까요?")) {
      return;
    }


    current.questions =
      current.questions.filter(
        q => q.id !== questionId
      );


    renderEditor();

  }


  async function saveQuestions() {

    if (!current) return;


    /*
      문제 내용 / 배점 / 해설
    */
    document
      .querySelectorAll("[data-f]")
      .forEach(el => {

        const q =
          current.questions.find(
            item => item.id === el.dataset.qid
          );


        if (!q) return;


        if (el.dataset.f === "points") {

          q.points =
            Number(el.value || 0);

        } else {

          q[el.dataset.f] =
            el.value;

        }

      });


    /*
      보기 내용
    */
    document
      .querySelectorAll(".ipg-option-input")
      .forEach(input => {

        const q =
          current.questions.find(
            item => item.id === input.dataset.qid
          );


        if (!q) return;


        const option =
          q.options.find(
            item => item.id === input.dataset.oid
          );


        if (option) {
          option.text = input.value;
        }

      });


    /*
      정답
    */
    document
      .querySelectorAll(
        'input[type="radio"][data-answer-qid]:checked'
      )
      .forEach(radio => {

        const q =
          current.questions.find(
            item => item.id === radio.dataset.answerQid
          );


        if (!q) return;


        q.answerId =
          radio.value;

      });


    /*
      데이터 정리
    */
    current.questions =
      current.questions.map(q => {

        normalizeQuestion(q);

        updateCorrectText(q);

        return q;

      });


    await setDoc(
      doc(db, "sessions", code),
      current
    );


    renderEditor();


    alert("문제가 저장되었습니다.");

  }


  function copyLink() {

    const url =
      `${location.origin}${location.pathname.replace(
        /admin\.html$/,
        "index.html"
      )}?code=${encodeURIComponent(code)}`;


    navigator.clipboard.writeText(url)
      .then(() => {

        alert(
          "참여 링크가 복사되었습니다."
        );

      })
      .catch(() => {

        prompt(
          "아래 링크를 복사하세요.",
          url
        );

      });

  }


  async function getResults() {

    if (!code) return [];


    const snapshot =
      await getDocs(
        collection(
          db,
          "sessions",
          code,
          "results"
        )
      );


    const results = [];


    snapshot.forEach(docSnap => {

      results.push({
        id: docSnap.id,
        ...docSnap.data()
      });

    });


    return results;

  }


  async function refresh() {

    try {

      currentResults =
        await getResults();


      currentResults.sort(
        (a, b) => {

          if (
            Number(b.score || 0) !==
            Number(a.score || 0)
          ) {

            return (
              Number(b.score || 0) -
              Number(a.score || 0)
            );

          }


          return (
            Number(b.correctCount || 0) -
            Number(a.correctCount || 0)
          );

        }
      );


      renderResults();

    } catch (error) {

      console.error(
        "결과 불러오기 실패:",
        error
      );

    }

  }


  function formatDateTime(value) {

    if (!value) return "";


    if (
      typeof value.toDate === "function"
    ) {

      return value
        .toDate()
        .toLocaleString("ko-KR");

    }


    const date =
      new Date(value);


    if (
      Number.isNaN(date.getTime())
    ) {

      return "";

    }


    return date.toLocaleString("ko-KR");

  }


  function renderResults() {

    const container =
      $("resultsTable");


    if (currentResults.length === 0) {

      container.innerHTML =
        `<div class="empty">
          아직 제출한 참가자가 없습니다.
        </div>`;

      return;

    }


    const total =
      current.questions?.length || 0;


    container.innerHTML = `

      <div class="result-table-wrap">

        <table>

          <thead>

            <tr>

              <th>순위</th>
              <th>이름</th>
              <th>소속</th>
              <th>점수</th>
              <th>정답</th>
              <th>전체</th>
              <th>제출시간</th>

            </tr>

          </thead>

          <tbody>

            ${currentResults.map(
              (result, index) => {

                return `

                  <tr>

                    <td>
                      ${index + 1}
                    </td>

                    <td>
                      ${escapeHtml(
                        result.name || ""
                      )}
                    </td>

                    <td>
                      ${escapeHtml(
                        result.affiliation || ""
                      )}
                    </td>

                    <td>
                      <strong>
                        ${Number(
                          result.score || 0
                        )}
                      </strong>
                    </td>

                    <td>
                      ${Number(
                        result.correctCount || 0
                      )}
                    </td>

                    <td>
                      ${Number(
                        result.total || total
                      )}
                    </td>

                    <td>
                      ${escapeHtml(
                        formatDateTime(
                          result.submittedAt
                        )
                      )}
                    </td>

                  </tr>

                `;

              }
            ).join("")}

          </tbody>

        </table>

      </div>

    `;

  }


  function downloadExcel() {

    if (currentResults.length === 0) {

      alert(
        "다운로드할 결과가 없습니다."
      );

      return;

    }


    const rows =
      currentResults.map(
        (result, index) => {

          return {

            순위:
              index + 1,

            이름:
              result.name || "",

            소속:
              result.affiliation || "",

            점수:
              Number(result.score || 0),

            정답수:
              Number(
                result.correctCount || 0
              ),

            전체문제수:
              Number(
                result.total ||
                current.questions?.length ||
                0
              ),

            제출시간:
              formatDateTime(
                result.submittedAt
              )

          };

        }
      );


    const worksheet =
      XLSX.utils.json_to_sheet(rows);


    const workbook =
      XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
      workbook,
      worksheet,
      "결과"
    );


    XLSX.writeFile(
      workbook,
      `${current.title || "퀴즈"}_결과.xlsx`
    );

  }


  function backToList() {

    if (poll) {

      clearInterval(poll);
      poll = null;

    }


    current = null;
    code = null;
    currentResults = [];


    hide("dashboardView");
    show("listView");


    loadSessions();

  }


  /*
    이미 로그인한 경우 바로 관리자 화면으로 이동
  */
  if (
    localStorage.getItem(
      "quiz_admin_logged_in"
    ) === "true"
  ) {

    hide("loginView");
    show("listView");

    loadSessions();

  }


  /*
    HTML onclick에서 사용할 수 있도록
    전역 함수로 등록
  */
  window.login = login;
  window.createSession = createSession;
  window.openExistingSession = openExistingSession;
  window.toggleStatus = toggleStatus;
  window.saveSessionInfo = saveSessionInfo;
  window.renderEditor = renderEditor;
  window.addQuestion = addQuestion;
  window.deleteQuestion = deleteQuestion;
  window.addOptionToQuestion = addOptionToQuestion;
  window.deleteOptionFromQuestion =
    deleteOptionFromQuestion;
  window.saveQuestions = saveQuestions;
  window.copyLink = copyLink;
  window.downloadExcel = downloadExcel;
  window.backToList = backToList;

</script>
