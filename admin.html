<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감염관리실 퀴즈 관리자 모드</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

    :root {
      --bg-deep: #071a26;
      --bg-panel: #0f2a3a;
      --bg-panel-raised: #14344768;
      --line: #1f4a5e;
      --mint: #3ddc97;
      --mint-dim: #2a9c6e;
      --amber: #ffb84c;
      --coral: #ff6b6b;
      --text-hi: #eaf4f4;
      --text-mid: #a9c4cc;
      --text-dim: #5f8894;
      --font-sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-mono: 'IBM Plex Mono', 'Consolas', monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background: radial-gradient(ellipse at 50% -10%, #103244 0%, var(--bg-deep) 55%);
      color: var(--text-hi);
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 25px;
      font-weight: 700;
    }

    h2 {
      margin-top: 0;
      font-weight: 700;
      color: var(--text-hi);
    }

    .card {
      background: linear-gradient(180deg, #0d2534 0%, #0a1f2c 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 20px 40px -25px rgba(0,0,0,0.6);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 15px;
      margin-top: 6px;
      background: rgba(255,255,255,0.02);
      color: var(--text-hi);
      font-family: var(--font-sans);
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--mint-dim);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 15px;
      color: var(--text-mid);
      font-size: 13px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
      font-family: var(--font-sans);
      font-weight: 700;
      background: rgba(255,255,255,0.06);
      color: var(--text-hi);
    }

    button:hover {
      opacity: 0.9;
      border-color: var(--mint-dim);
    }

    .btn-primary {
      background: var(--mint);
      color: #06251b;
      border: none;
    }
    .btn-primary:hover { background: #4fe8a8; }

    .btn-success {
      background: var(--mint);
      color: #06251b;
      border: none;
    }
    .btn-success:hover { background: #4fe8a8; }

    .btn-danger {
      background: var(--coral);
      color: #2a0a0a;
      border: none;
    }
    .btn-danger:hover { background: #ff8a8a; }

    .btn-secondary {
      background: transparent;
      color: var(--text-hi);
      border: 1px solid var(--line);
    }
    .btn-secondary:hover {
      border-color: var(--mint-dim);
      color: var(--mint);
    }

    .small {
      padding: 7px 11px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .session-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      background: var(--bg-panel);
    }

    .session-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-hi);
    }

    .session-info {
      color: var(--text-mid);
      font-size: 14px;
      line-height: 1.7;
    }
    .session-info strong { color: var(--text-hi); }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .question-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
      background: var(--bg-panel);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .option-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .option-row input[type="text"] {
      flex: 1;
      margin-top: 0;
    }

    .option-row input[type="radio"] {
      width: auto;
      margin: 0;
      accent-color: var(--mint);
    }

    .option-label {
      min-width: 25px;
      font-weight: 700;
      color: var(--mint);
    }

    .code-box {
      background: rgba(61,220,151,0.08);
      border: 1px dashed var(--mint-dim);
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 14px;
      color: var(--text-mid);
    }

    .code-value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      font-family: var(--font-mono);
      color: var(--mint);
    }

    .status {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-family: var(--font-mono);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--text-mid);
    }

    .status.open {
      background: rgba(61,220,151,0.12);
      color: var(--mint);
      border-color: var(--mint-dim);
    }

    .status.closed {
      background: rgba(255,107,107,0.12);
      color: var(--coral);
      border-color: var(--coral);
    }

    .status.draft {
      background: rgba(255,184,76,0.12);
      color: var(--amber);
      border-color: var(--amber);
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .result-table th,
    .result-table td {
      border: 1px solid var(--line);
      padding: 9px;
      text-align: center;
      font-size: 14px;
      color: var(--text-mid);
    }

    .result-table th {
      background: var(--bg-panel-raised);
      color: var(--text-hi);
      font-family: var(--font-mono);
      font-weight: 600;
    }
    .result-table td { color: var(--text-hi); }

    .status-picker {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .status-btn {
      flex: 1;
      padding: 11px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--text-mid);
      font-weight: 700;
      font-size: 13.5px;
      font-family: var(--font-sans);
      cursor: pointer;
    }
    .status-btn:hover { border-color: var(--mint-dim); }

    .status-btn[data-value="draft"].active {
      background: rgba(255,184,76,0.16);
      border-color: var(--amber);
      color: var(--amber);
    }
    .status-btn[data-value="open"].active {
      background: rgba(61,220,151,0.16);
      border-color: var(--mint);
      color: var(--mint);
    }
    .status-btn[data-value="closed"].active {
      background: rgba(255,107,107,0.16);
      border-color: var(--coral);
      color: var(--coral);
    }

    .time-limit-help {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .container {
        padding: 15px;
      }

      .card {
        padding: 16px;
      }

      .question-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>감염관리실 퀴즈 관리자 모드</h1>

  <!-- 로그인 -->
  <div id="loginSection" class="card">
    <h2>관리자 로그인</h2>

    <label>관리자 비밀번호</label>
    <input
      id="adminPassword"
      type="password"
      placeholder="관리자 비밀번호"
    />

    <button
      class="btn-primary"
      style="margin-top:15px;"
      onclick="adminLogin()"
    >
      로그인
    </button>
  </div>


  <!-- 관리자 화면 -->
  <div id="adminSection" class="hidden">

    <!-- 퀴즈 목록 -->
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h2>퀴즈 목록</h2>

        <button
          class="btn-primary"
          onclick="createNewSession()"
        >
          + 새 퀴즈 만들기
        </button>
      </div>

      <div id="sessionList"></div>
    </div>


    <!-- 퀴즈 편집 -->
    <div id="editorSection" class="card hidden">

      <h2>퀴즈 관리</h2>

      <label>퀴즈 제목</label>
      <input id="sessionTitle" />

      <label>참가 코드</label>
      <input
        id="sessionCode"
        readonly
      />

      <div class="code-box">
        <div>참가자가 입력하는 코드</div>
        <div
          id="displayParticipantCode"
          class="code-value"
        ></div>
      </div>


      <label>관리 코드 (4자리 숫자)</label>
      <input
        id="managerCode"
        type="text"
        inputmode="numeric"
        maxlength="4"
        placeholder="예: 4827"
      />

      <div class="code-box">
        <div>담당자가 퀴즈를 관리할 때 사용하는 코드</div>
        <div
          id="displayManagerCode"
          class="code-value"
        ></div>
      </div>


      <label>상태</label>
      <div class="status-picker" id="sessionStatusPicker">
        <button type="button" class="status-btn" data-value="draft" onclick="selectSessionStatus('draft')">준비중</button>
        <button type="button" class="status-btn" data-value="open" onclick="selectSessionStatus('open')">공개</button>
        <button type="button" class="status-btn" data-value="closed" onclick="selectSessionStatus('closed')">종료</button>
      </div>
      <input type="hidden" id="sessionStatus" value="draft" />


      <div
        class="row"
        style="margin-top:20px;"
      >
        <button
          class="btn-success"
          onclick="saveSession()"
        >
          퀴즈 저장
        </button>

        <button
          class="btn-secondary"
          onclick="closeEditor()"
        >
          목록으로
        </button>

        <button
          class="btn-danger"
          onclick="deleteCurrentSession()"
        >
          이 퀴즈 삭제
        </button>
      </div>

    </div>


    <!-- 문제 편집 -->
    <div
      id="questionSection"
      class="card hidden"
    >

      <div class="row" style="justify-content:space-between;">
        <h2>문제 관리</h2>

        <div class="row">
          <button
            class="btn-primary"
            onclick="addQuestion()"
          >
            + 문제 추가
          </button>

          <button
            class="btn-secondary"
            onclick="downloadQuestionsCsv()"
          >
            문제 엑셀(CSV) 다운로드
          </button>

          <button
            class="btn-secondary"
            onclick="document.getElementById('questionsImportInput').click()"
          >
            엑셀(CSV) 업로드로 반영
          </button>

          <input
            type="file"
            id="questionsImportInput"
            accept=".csv"
            style="display:none;"
            onchange="handleQuestionsImport(event)"
          />
        </div>
      </div>

      <div class="time-limit-help" style="margin-top:-4px;">
        업로드용 서식은 "문제 엑셀(CSV) 다운로드"로 현재 문제를 먼저 받아 형식을 확인한 뒤,
        같은 서식으로 채워서 업로드하면 가장 안전합니다. 업로드하면 현재 문제 목록 전체가
        교체되며, "문제 저장" 버튼을 눌러야 최종 반영됩니다.
      </div>

      <div id="questionList"></div>

      <button
        class="btn-success"
        onclick="saveQuestions()"
      >
        문제 저장
      </button>

    </div>


    <!-- 결과 -->
    <div
      id="resultSection"
      class="card hidden"
    >

      <div class="row" style="justify-content:space-between;">
        <h2>참가 결과</h2>

        <button
          class="btn-success"
          onclick="downloadExcel()"
        >
          엑셀 다운로드 (현재 목록)
        </button>
      </div>

      <div class="row" style="align-items:flex-end; margin-bottom:10px;">

        <div style="min-width:150px;">
          <label>시작일</label>
          <input type="date" id="resultDateFrom" />
        </div>

        <div style="min-width:150px;">
          <label>종료일</label>
          <input type="date" id="resultDateTo" />
        </div>

        <button
          class="btn-primary small"
          style="margin-top:15px;"
          onclick="applyResultDateFilter()"
        >
          기간 적용
        </button>

        <button
          class="btn-secondary small"
          style="margin-top:15px;"
          onclick="resetResultDateFilter()"
        >
          전체 보기
        </button>

      </div>

      <div
        id="resultFilterInfo"
        class="time-limit-help"
        style="margin-top:0; margin-bottom:10px;"
      ></div>

      <div id="resultList"></div>

    </div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    collection,
    getDocs
  }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /*
  =====================================================
  Firebase 설정
  =====================================================
  */

  const firebaseConfig = {

    apiKey: "AIzaSyDJuaH028Hw0jbHVekhSY8hrzlmsVgHpqI",

    authDomain: "icquizgame.firebaseapp.com",

    projectId: "icquizgame",

    storageBucket: "icquizgame.firebasestorage.app",

    messagingSenderId: "987272482834",

    appId: "1:987272482834:web:612b4edb47aae69ac848cb"

  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  /*
  =====================================================
  관리자 설정
  =====================================================
  */

  const ADMIN_PASSWORD = "ISH2801";

  const MASTER_KEY = "ISH2801";


  let current = null;
  let currentResults = [];
  let activeResults = [];


  const $ = id => document.getElementById(id);


  /*
  =====================================================
  기본 문제
  =====================================================
  */

  const DEFAULT_QUESTIONS = [
    {
      id: makeId("q"),
      text: "격리주의에 대한 기본적인 설명으로 가장 적절한 것은?",
      options: [
        {
          id: makeId("o"),
          text: "감염 전파를 예방하기 위한 조치"
        },
        {
          id: makeId("o"),
          text: "환자의 식사를 제한하는 조치"
        },
        {
          id: makeId("o"),
          text: "환자의 이동을 무조건 금지하는 조치"
        },
        {
          id: makeId("o"),
          text: "의료진의 업무를 줄이기 위한 조치"
        }
      ],
      answerId: "",
      correct: "",
      points: 100,
      explain: "",

      /*
        시간 제한
        0 = 제한 없음
      */
      timeLimit: 0
    }
  ];


  function makeId(prefix) {
    return prefix + "_" + Math.random().toString(36).substring(2, 10);
  }


  /*
  =====================================================
  로그인
  =====================================================
  */

  window.adminLogin = function() {

    const password = $("adminPassword").value;

    if (password !== ADMIN_PASSWORD) {
      alert("관리자 비밀번호가 올바르지 않습니다.");
      return;
    }

    $("loginSection").classList.add("hidden");
    $("adminSection").classList.remove("hidden");

    loadSessions();
  };


  /*
  =====================================================
  퀴즈 상태 선택 (버튼 그룹)
  =====================================================
  */

  window.selectSessionStatus = function(value) {

    $("sessionStatus").value = value;

    document
      .querySelectorAll(".status-btn")
      .forEach(btn => {
        btn.classList.toggle(
          "active",
          btn.dataset.value === value
        );
      });

  };


  /*
  =====================================================
  참가 코드 생성
  =====================================================
  */

  function generateParticipantCode() {

    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (let i = 0; i < 6; i++) {
      code += chars[
        Math.floor(Math.random() * chars.length)
      ];
    }

    return code;
  }


  /*
  =====================================================
  세션 목록
  =====================================================
  */

  async function loadSessions() {

    const list = $("sessionList");

    list.innerHTML = "불러오는 중...";

    try {

      const snap = await getDocs(
        collection(db, "sessions")
      );

      const sessions = [];

      snap.forEach(docSnap => {

        sessions.push({
          id: docSnap.id,
          ...docSnap.data()
        });

      });


      sessions.sort((a, b) =>
        String(b.createdAt || "")
          .localeCompare(String(a.createdAt || ""))
      );


      if (sessions.length === 0) {

        list.innerHTML = `
          <p>아직 만들어진 퀴즈가 없습니다.</p>
        `;

        return;
      }


      list.innerHTML = sessions.map(session => {

        const statusClass =
          session.status || "draft";

        const statusText =
          statusClass === "open"
            ? "공개"
            : statusClass === "closed"
              ? "종료"
              : "준비중";


        return `
          <div class="session-item">

            <div class="session-title">
              ${escapeHtml(session.title || "제목 없음")}
            </div>

            <div class="session-info">

              참가 코드:
              <strong>
                ${escapeHtml(session.code || "")}
              </strong>

              <br>

              관리 코드:
              <strong>
                ${session.managerCode ? "설정됨" : "미설정"}
              </strong>

              <br>

              상태:
              <span class="status ${statusClass}">
                ${statusText}
              </span>

            </div>

            <div
              class="row"
              style="margin-top:12px;"
            >

              <button
                class="btn-primary small"
                data-code="${escapeAttr(session.code || "")}"
                onclick="openExistingSession(this.dataset.code)"
              >
                관리하기
              </button>

              <button
                class="btn-danger small"
                data-code="${escapeAttr(session.code || "")}"
                onclick="deleteSession(this.dataset.code)"
              >
                삭제
              </button>

            </div>

          </div>
        `;

      }).join("");

    } catch (error) {

      console.error("퀴즈 목록 불러오기 오류:", error);

      list.innerHTML = `
        <p>
          퀴즈 목록을 불러오지 못했습니다.
        </p>
        <p style="color:#dc2626;font-size:13px;">
          ${escapeHtml(error.message || error)}
        </p>
      `;

    }

  }


  /*
  =====================================================
  새 퀴즈
  =====================================================
  */

  window.createNewSession = async function() {

    try {

      let participantCode;

      do {

        participantCode =
          generateParticipantCode();

      } while (
        await sessionExists(participantCode)
      );


      current = {

        code: participantCode,

        title: "",

        managerCode: "",

        status: "draft",

        createdAt:
          new Date().toISOString(),

        questions:
          structuredClone(DEFAULT_QUESTIONS)

      };


      showEditor();

    } catch (error) {

      console.error(
        "새 퀴즈 생성 오류:",
        error
      );

      alert(
        "새 퀴즈를 만들 수 없습니다.\n\n" +
        (error.message || error)
      );

    }

  };


  async function sessionExists(code) {

    const snap = await getDoc(
      doc(db, "sessions", code)
    );

    return snap.exists();

  }


  /*
  =====================================================
  기존 퀴즈 관리하기
  =====================================================
  */

  window.openExistingSession = async function(code) {

    try {

      const snap = await getDoc(
        doc(db, "sessions", code)
      );


      if (!snap.exists()) {

        alert("해당 퀴즈를 찾을 수 없습니다.");

        await loadSessions();

        return;
      }


      const session = snap.data();


      const inputCode =
        prompt(
          "이 퀴즈의 4자리 관리 코드를 입력하세요.\n\n마스터키를 사용하는 경우 마스터키를 입력하세요."
        );


      if (inputCode === null) {
        return;
      }


      const entered =
        inputCode.trim();


      const managerCode =
        String(session.managerCode || "").trim();


      const isMaster =
        entered === MASTER_KEY;


      const isManager =
        managerCode &&
        entered === managerCode;


      if (!isMaster && !isManager) {

        alert("관리 코드가 올바르지 않습니다.");

        return;
      }


      const rawQuestions =
        Array.isArray(session.questions)
          ? session.questions
          : [];


      const needsNormalization =
        rawQuestions.some(
          q =>
            !q ||
            !Array.isArray(q.options) ||
            q.options.length < 2
        );


      current = {

        ...session,

        code:
          session.code || code,

        questions:
          needsNormalization
            ? normalizeQuestions(rawQuestions)
            : rawQuestions

      };


      showEditor();

    } catch (error) {

      console.error(
        "퀴즈 불러오기 오류:",
        error
      );

      alert(
        "퀴즈를 불러오는 중 오류가 발생했습니다.\n\n" +
        (error.message || error)
      );

    }

  };

  /*
  =====================================================
  문제 정규화
  =====================================================
  */

  function normalizeQuestions(questions) {

    if (!Array.isArray(questions)) {
      return [];
    }


    return questions.map(q => {

      if (
        q &&
        Array.isArray(q.options) &&
        q.options.length >= 2
      ) {

        /*
          기존 문제에 시간 제한 값이 없으면
          제한 없음으로만 보완합니다.
        */

        if (
          q.timeLimit === undefined ||
          q.timeLimit === null
        ) {

          return {
            ...q,
            timeLimit: 0
          };

        }


        return q;

      }


      const oldCorrect =
        q && q.correct
          ? q.correct
          : "";


      const options = [

        {
          id: makeId("o"),
          text: oldCorrect
        },

        {
          id: makeId("o"),
          text: ""
        }

      ];


      return {

        ...(q || {}),

        id:
          q && q.id
            ? q.id
            : makeId("q"),

        text:
          q && q.text
            ? String(q.text)
            : "",

        options,

        answerId:
          q && q.answerId
            ? q.answerId
            : (
                oldCorrect
                  ? options[0].id
                  : ""
              ),

        correct:
          oldCorrect,

        points:
          q && q.points != null
            ? Number(q.points)
            : 100,

        explain:
          q && q.explain
            ? String(q.explain)
            : "",

        timeLimit:
          q && q.timeLimit != null
            ? Number(q.timeLimit)
            : 0

      };

    });

  }

  window.removeOption =
    function(questionId, optionId) {

      const question =
        current.questions.find(
          q => q.id === questionId
        );


      if (!question) return;


      if (question.options.length <= 2) {

        alert(
          "보기는 최소 2개가 필요합니다."
        );

        return;
      }


      if (
        question.answerId === optionId
      ) {

        question.answerId = "";

      }


      question.options =
        question.options.filter(
          o => o.id !== optionId
        );


      renderQuestions();

  /*
  =====================================================
  문제 저장
  =====================================================
  */

  function syncQuestionsFromDom() {

    const cards =
      document.querySelectorAll(
        ".question-card"
      );


    cards.forEach(card => {

      const questionId =
        card.dataset.questionId;


      const question =
        current.questions.find(
          q => q.id === questionId
        );


      if (!question) return;


      question.text =
        card
          .querySelector(".question-text")
          .value.trim();


      question.points =
        Number(
          card
            .querySelector(".question-points")
            .value || 0
        );


      /*
      =================================================
      시간 제한 저장
      =================================================
      */

      const timeLimitInput =
        card.querySelector(
          ".question-time-limit"
        );


      let timeLimit =
        Number(
          timeLimitInput.value || 0
        );


      /*
        잘못된 값 방지
      */

      if (
        !Number.isFinite(timeLimit) ||
        timeLimit < 0
      ) {

        timeLimit = 0;

      }


      timeLimit =
        Math.floor(timeLimit);


      question.timeLimit =
        timeLimit;


      /*
      =================================================
      보기 저장
      =================================================
      */

      const optionRows =
        card.querySelectorAll(
          ".option-row"
        );


      question.options =
        Array.from(optionRows).map(
          row => {

            const id =
              row.dataset.optionId;

            const text =
              row
                .querySelector(".option-text")
                .value.trim();


            return {
              id,
              text
            };

          }
        );


      const checked =
        card.querySelector(
          'input[type="radio"]:checked'
        );


      question.answerId =
        checked
          ? checked.closest(".option-row").dataset.optionId
          : "";


      const answerOption =
        question.options.find(
          o => o.id === question.answerId
        );


      question.correct =
        answerOption
          ? answerOption.text
          : "";


      question.explain =
        card
          .querySelector(".question-explain")
          .value.trim();

    });

  }

  /*
  =====================================================
  문제 엑셀(CSV) 다운로드
  =====================================================
  */

  window.downloadQuestionsCsv = function() {

    if (!current) {

      alert("먼저 퀴즈를 선택해주세요.");

      return;
    }


    syncQuestionsFromDom();


    if (!current.questions.length) {

      alert("다운로드할 문제가 없습니다.");

      return;
    }


    const maxOptions =
      current.questions.reduce(
        (max, q) =>
          Math.max(max, q.options.length),
        0
      );


    const headers = ["문제", "배점", "시간제한(초)"];

    for (let i = 1; i <= maxOptions; i++) {
      headers.push("보기" + i);
    }

    headers.push("정답번호");
    headers.push("해설");


    const rows =
      current.questions.map(q => {

        const row = [
          q.text || "",
          q.points || 0,
          q.timeLimit || 0
        ];

        for (let i = 0; i < maxOptions; i++) {
          row.push(
            q.options[i] ? q.options[i].text : ""
          );
        }

        const answerIndex =
          q.options.findIndex(
            o => o.id === q.answerId
          ) + 1;

        row.push(answerIndex || "");
        row.push(q.explain || "");

        return row;

      });


    downloadCsvFile(
      toCsv([headers, ...rows]),
      `${current.title || "퀴즈"}_문제.csv`
    );

  };


  /*
  =====================================================
  문제 엑셀(CSV) 업로드로 반영
  =====================================================
  */

  window.handleQuestionsImport = async function(event) {

    if (!current) {

      alert("먼저 퀴즈를 선택해주세요.");

      event.target.value = "";

      return;
    }


    const file = event.target.files[0];

    if (!file) return;


    try {

      const text = await file.text();

      const rows = parseCsv(text);


      if (rows.length < 2) {

        alert(
          "업로드할 문제 데이터를 찾을 수 없습니다."
        );

        event.target.value = "";

        return;
      }


      const header = rows[0];

      const idxText = header.indexOf("문제");
      const idxPoints = header.indexOf("배점");
      const idxTime = header.indexOf("시간제한(초)");
      const idxAnswer = header.indexOf("정답번호");
      const idxExplain = header.indexOf("해설");

      const optionIdxs =
        header
          .map((h, i) => (h && h.indexOf("보기") === 0) ? i : -1)
          .filter(i => i >= 0);


      if (
        idxText === -1 ||
        idxAnswer === -1 ||
        optionIdxs.length === 0
      ) {

        alert(
          "CSV 형식이 올바르지 않습니다.\n\n" +
          "\"문제 엑셀(CSV) 다운로드\"로 받은 서식을 기준으로 작성해주세요."
        );

        event.target.value = "";

        return;

      }


      const newQuestions = [];

      for (let r = 1; r < rows.length; r++) {

        const row = rows[r];

        const text = (row[idxText] || "").trim();

        if (!text) continue;


        const optionTexts =
          optionIdxs
            .map(i => (row[i] || "").trim())
            .filter(t => t !== "");


        if (optionTexts.length < 2) continue;


        const options =
          optionTexts.map(t => ({
            id: makeId("o"),
            text: t
          }));


        const answerIndex =
          Number(row[idxAnswer] || 0);

        const answerOption =
          options[answerIndex - 1] || options[0];


        newQuestions.push({

          id: makeId("q"),

          text,

          options,

          answerId: answerOption.id,

          correct: answerOption.text,

          points:
            idxPoints >= 0
              ? (Number(row[idxPoints]) || 100)
              : 100,

          explain:
            idxExplain >= 0
              ? (row[idxExplain] || "").trim()
              : "",

          timeLimit:
            idxTime >= 0
              ? (Number(row[idxTime]) || 0)
              : 0

        });

      }


      if (newQuestions.length === 0) {

        alert(
          "불러올 수 있는 문제가 없습니다. CSV 내용을 확인해주세요."
        );

        event.target.value = "";

        return;

      }


      const confirmed =
        confirm(
          `${newQuestions.length}개의 문제를 불러와 현재 문제 목록 전체를 대체합니다.\n\n계속할까요?`
        );


      if (!confirmed) {

        event.target.value = "";

        return;

      }


      current.questions = newQuestions;

      renderQuestions();

      event.target.value = "";

      alert(
        "문제를 불러왔습니다. 내용을 확인한 후 \"문제 저장\" 버튼을 눌러야 최종 반영됩니다."
      );

    } catch (error) {

      console.error(
        "문제 업로드 오류:",
        error
      );

      alert(
        "문제를 불러오는 중 오류가 발생했습니다.\n\n" +
        (error.message || error)
      );

      event.target.value = "";

    }

  };

  async function loadResults(code) {

    const list =
      $("resultList");


    list.innerHTML =
      "결과를 불러오는 중...";


    try {

      const snap =
        await getDocs(
          collection(
            db,
            "sessions",
            code,
            "results"
          )
        );


      currentResults = [];


      snap.forEach(docSnap => {

        currentResults.push({

          id: docSnap.id,

          ...docSnap.data()

        });

      });


      currentResults.sort(
        (a, b) =>
          String(
            b.submittedAt || ""
          ).localeCompare(
            String(
              a.submittedAt || ""
            )
          )
      );


      activeResults =
        currentResults.slice();


      $("resultDateFrom").value = "";
      $("resultDateTo").value = "";
      $("resultFilterInfo").textContent = "";


      renderResults();

    } catch (error) {

      console.error(
        "결과 불러오기 오류:",
        error
      );

      list.innerHTML = `
        <p>결과를 불러오지 못했습니다.</p>
        <p style="color:#dc2626;font-size:13px;">
          ${escapeHtml(error.message || error)}
        </p>
      `;

    }

  }


  /*
  =====================================================
  결과 표시
  =====================================================
  */

  function formatSubmittedAt(value) {

    if (!value) return "-";

    const date = new Date(value);

    if (isNaN(date.getTime())) {
      return escapeHtml(String(value));
    }

    return date.toLocaleString(
      "ko-KR",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }


  function renderResults() {

    const list =
      $("resultList");


    if (!currentResults.length) {

      list.innerHTML =
        "<p>아직 참가 결과가 없습니다.</p>";

      return;
    }


    if (!activeResults.length) {

      list.innerHTML =
        "<p>선택한 기간에 해당하는 참가 결과가 없습니다.</p>";

      return;
    }


    list.innerHTML = `

      <table class="result-table">

        <thead>

          <tr>

            <th>이름</th>

            <th>소속</th>

            <th>점수</th>

            <th>제출시간</th>

          </tr>

        </thead>

        <tbody>

          ${
            activeResults.map(
              result => `

                <tr>

                  <td>
                    ${escapeHtml(
                      result.name || ""
                    )}
                  </td>

                  <td>
                    ${escapeHtml(
                      result.affiliation || ""
                    )}
                  </td>

                  <td>
                    ${Number(
                      result.score || 0
                    )}
                  </td>

                  <td>
                    ${formatSubmittedAt(
                      result.submittedAt
                    )}
                  </td>

                </tr>

              `
            ).join("")
          }

        </tbody>

      </table>

    `;

  }


  /*

  =====================================================
  */

  window.applyResultDateFilter = function() {

    const fromVal = $("resultDateFrom").value;
    const toVal = $("resultDateTo").value;

    if (!fromVal && !toVal) {
      alert("시작일 또는 종료일을 먼저 선택해주세요.");
      return;
    }

    const fromDate =
      fromVal ? new Date(fromVal + "T00:00:00") : null;

    const toDate =
      toVal ? new Date(toVal + "T23:59:59") : null;

    activeResults =
      currentResults.filter(result => {

        if (!result.submittedAt) return false;

        const t = new Date(result.submittedAt);

        if (isNaN(t.getTime())) return false;

        if (fromDate && t < fromDate) return false;

        if (toDate && t > toDate) return false;

        return true;

      });

    $("resultFilterInfo").textContent =
      `전체 ${currentResults.length}건 중 ${activeResults.length}건 표시 중 (선택한 기간 기준)`;

    renderResults();

  };

  window.resetResultDateFilter = function() {

    $("resultDateFrom").value = "";
    $("resultDateTo").value = "";
    $("resultFilterInfo").textContent = "";

    activeResults = currentResults.slice();

    renderResults();

  };


  /*
  =====================================================
  현재 퀴즈 삭제
  =====================================================
  */

  window.deleteCurrentSession =
    async function() {

      if (!current) return;

      await deleteSession(
        current.code
      );

    };


  /*
  =====================================================
  퀴즈 삭제
  =====================================================
  */

  window.deleteSession =
    async function(sessionCode) {

      try {

        const snap =
          await getDoc(
            doc(db, "sessions", sessionCode)
          );


        if (!snap.exists()) {

          alert(
            "이미 삭제된 퀴즈입니다."
          );

          await loadSessions();

          return;
        }


        const session =
          snap.data();


        const confirmed =
          confirm(
            `"${session.title || "제목 없음"}" 퀴즈를 삭제할까요?\n\n참가 코드: ${sessionCode}\n\n삭제하면 되돌릴 수 없습니다.`
          );


        if (!confirmed) {
          return;
        }


        await deleteDoc(
          doc(
            db,
            "sessions",
            sessionCode
          )
        );


        alert(
          "퀴즈가 삭제되었습니다."
        );


        if (
          current &&
          current.code === sessionCode
        ) {

          current = null;

          $("editorSection")
            .classList.add("hidden");

          $("questionSection")
            .classList.add("hidden");

          $("resultSection")
            .classList.add("hidden");

        }


        await loadSessions();

      } catch (error) {

        console.error(
          "퀴즈 삭제 오류:",
          error
        );

        alert(
          "퀴즈 삭제 중 오류가 발생했습니다.\n\n" +
          (error.message || error)
        );

      }

    };


  /*
  =====================================================
  엑셀 다운로드
  =====================================================
  */

  window.downloadExcel =
    function() {

      if (!activeResults.length) {

        alert(
          "다운로드할 결과가 없습니다. 기간 필터를 확인해주세요."
        );

        return;
      }


      const headers = [
        "이름",
        "소속",
        "점수",
        "제출시간"
      ];


      const rows =
        activeResults.map(
          result => [

            result.name || "",

            result.affiliation || "",

            result.score || 0,

            formatSubmittedAt(result.submittedAt)

          ]
        );


      const filterSuffix =
        (
          $("resultDateFrom").value ||
          $("resultDateTo").value
        )
          ? `_${$("resultDateFrom").value || "전체"}~${$("resultDateTo").value || "전체"}`
          : "";


      downloadCsvFile(
        toCsv([headers, ...rows]),
        `${current.title || "퀴즈"}_결과${filterSuffix}.csv`
      );

    };


  /*
  =====================================================
  유틸
  =====================================================
  */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttr(value) {

    return escapeHtml(value);

  }


  /*
  =====================================================
  CSV 빌드 / 다운로드 / 파싱 공용 함수
  =====================================================
  */

  function toCsv(rows) {

    return rows
      .map(
        row =>
          row.map(
            value =>
              `"${String(value ?? "")
                .replace(/"/g, '""')}"`
          ).join(",")
      )
      .join("\n");

  }


  function downloadCsvFile(csv, filename) {

    const blob =
      new Blob(
        ["\ufeff" + csv],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;
    a.download = filename;
    a.click();

    URL.revokeObjectURL(url);

  }


  function parseCsv(text) {

    text =
      text
        .replace(/^\uFEFF/, "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");

    const rows = [];

    let row = [];
    let field = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {

      const char = text[i];

      if (inQuotes) {

        if (char === '"') {

          if (text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = false;
          }

        } else {

          field += char;

        }

      } else {

        if (char === '"') {

          inQuotes = true;

        } else if (char === ",") {

          row.push(field);
          field = "";

        } else if (char === "\n") {

          row.push(field);
          rows.push(row);
          row = [];
          field = "";

        } else {

          field += char;

        }

      }

    }

    if (field.length > 0 || row.length > 0) {
      row.push(field);
      rows.push(row);
    }

    return rows.filter(
      r => r.some(cell => String(cell || "").trim() !== "")
    );

  }


</script>
