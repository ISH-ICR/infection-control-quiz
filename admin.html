<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감염관리실 퀴즈 관리자 모드</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

    :root {
      --bg-deep: #071a26;
      --bg-panel: #0f2a3a;
      --bg-panel-raised: #14344768;
      --line: #1f4a5e;
      --mint: #3ddc97;
      --mint-dim: #2a9c6e;
      --amber: #ffb84c;
      --coral: #ff6b6b;
      --text-hi: #eaf4f4;
      --text-mid: #a9c4cc;
      --text-dim: #5f8894;
      --font-sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-mono: 'IBM Plex Mono', 'Consolas', monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background: radial-gradient(ellipse at 50% -10%, #103244 0%, var(--bg-deep) 55%);
      color: var(--text-hi);
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 25px;
      font-weight: 700;
    }

    h2 {
      margin-top: 0;
      font-weight: 700;
      color: var(--text-hi);
    }

    .card {
      background: linear-gradient(180deg, #0d2534 0%, #0a1f2c 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 20px 40px -25px rgba(0,0,0,0.6);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 15px;
      margin-top: 6px;
      background: rgba(255,255,255,0.02);
      color: var(--text-hi);
      font-family: var(--font-sans);
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--mint-dim);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 15px;
      color: var(--text-mid);
      font-size: 13px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
      font-family: var(--font-sans);
      font-weight: 700;
      background: rgba(255,255,255,0.06);
      color: var(--text-hi);
    }

    button:hover {
      opacity: 0.9;
      border-color: var(--mint-dim);
    }

    .btn-primary {
      background: var(--mint);
      color: #06251b;
      border: none;
    }
    .btn-primary:hover { background: #4fe8a8; }

    .btn-success {
      background: var(--mint);
      color: #06251b;
      border: none;
    }
    .btn-success:hover { background: #4fe8a8; }

    .btn-danger {
      background: var(--coral);
      color: #2a0a0a;
      border: none;
    }
    .btn-danger:hover { background: #ff8a8a; }

    .btn-secondary {
      background: transparent;
      color: var(--text-hi);
      border: 1px solid var(--line);
    }
    .btn-secondary:hover {
      border-color: var(--mint-dim);
      color: var(--mint);
    }

    .small {
      padding: 7px 11px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .session-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      background: var(--bg-panel);
    }

    .session-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-hi);
    }

    .session-info {
      color: var(--text-mid);
      font-size: 14px;
      line-height: 1.7;
    }
    .session-info strong { color: var(--text-hi); }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .question-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
      background: var(--bg-panel);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .option-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .option-row input[type="text"] {
      flex: 1;
      margin-top: 0;
    }

    .option-row input[type="radio"] {
      width: auto;
      margin: 0;
      accent-color: var(--mint);
    }

    .option-label {
      min-width: 25px;
      font-weight: 700;
      color: var(--mint);
    }

    .code-box {
      background: rgba(61,220,151,0.08);
      border: 1px dashed var(--mint-dim);
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 14px;
      color: var(--text-mid);
    }

    .code-value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      font-family: var(--font-mono);
      color: var(--mint);
    }

    .status {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-family: var(--font-mono);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--text-mid);
    }

    .status.open {
      background: rgba(61,220,151,0.12);
      color: var(--mint);
      border-color: var(--mint-dim);
    }

    .status.closed {
      background: rgba(255,107,107,0.12);
      color: var(--coral);
      border-color: var(--coral);
    }

    .status.draft {
      background: rgba(255,184,76,0.12);
      color: var(--amber);
      border-color: var(--amber);
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .result-table th,
    .result-table td {
      border: 1px solid var(--line);
      padding: 9px;
      text-align: center;
      font-size: 14px;
      color: var(--text-mid);
    }

    .result-table th {
      background: var(--bg-panel-raised);
      color: var(--text-hi);
      font-family: var(--font-mono);
      font-weight: 600;
    }
    .result-table td { color: var(--text-hi); }

    /* =========================
       시간 제한 설정
    ========================= */

    .time-limit-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 6px;
    }

    .time-limit-row select {
      flex: 1;
      margin-top: 0;
    }

    .custom-time-input {
      flex: 1;
      margin-top: 0;
      display: none;
    }

    .time-limit-help {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .container {
        padding: 15px;
      }

      .card {
        padding: 16px;
      }

      .question-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .time-limit-row {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>감염관리실 퀴즈 관리자 모드</h1>

  <!-- 로그인 -->
  <div id="loginSection" class="card">
    <h2>관리자 로그인</h2>

    <label>관리자 비밀번호</label>
    <input
      id="adminPassword"
      type="password"
      placeholder="관리자 비밀번호"
    />

    <button
      class="btn-primary"
      style="margin-top:15px;"
      onclick="adminLogin()"
    >
      로그인
    </button>
  </div>


  <!-- 관리자 화면 -->
  <div id="adminSection" class="hidden">

    <!-- 퀴즈 목록 -->
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h2>퀴즈 목록</h2>

        <button
          class="btn-primary"
          onclick="createNewSession()"
        >
          + 새 퀴즈 만들기
        </button>
      </div>

      <div id="sessionList"></div>
    </div>


    <!-- 퀴즈 편집 -->
    <div id="editorSection" class="card hidden">

      <h2>퀴즈 관리</h2>

      <label>퀴즈 제목</label>
      <input id="sessionTitle" />

      <label>참가 코드</label>
      <input
        id="sessionCode"
        readonly
      />

      <div class="code-box">
        <div>참가자가 입력하는 코드</div>
        <div
          id="displayParticipantCode"
          class="code-value"
        ></div>
      </div>


      <label>관리 코드 (4자리 숫자)</label>
      <input
        id="managerCode"
        type="text"
        inputmode="numeric"
        maxlength="4"
        placeholder="예: 4827"
      />

      <div class="code-box">
        <div>담당자가 퀴즈를 관리할 때 사용하는 코드</div>
        <div
          id="displayManagerCode"
          class="code-value"
        ></div>
      </div>


      <label>상태</label>
      <select id="sessionStatus">
        <option value="draft">준비중</option>
        <option value="open">공개</option>
        <option value="closed">종료</option>
      </select>


      <div
        class="row"
        style="margin-top:20px;"
      >
        <button
          class="btn-success"
          onclick="saveSession()"
        >
          퀴즈 저장
        </button>

        <button
          class="btn-secondary"
          onclick="closeEditor()"
        >
          목록으로
        </button>

        <button
          class="btn-danger"
          onclick="deleteCurrentSession()"
        >
          이 퀴즈 삭제
        </button>
      </div>

    </div>


    <!-- 문제 편집 -->
    <div
      id="questionSection"
      class="card hidden"
    >

      <div class="row" style="justify-content:space-between;">
        <h2>문제 관리</h2>

        <button
          class="btn-primary"
          onclick="addQuestion()"
        >
          + 문제 추가
        </button>
      </div>

      <div id="questionList"></div>

      <button
        class="btn-success"
        onclick="saveQuestions()"
      >
        문제 저장
      </button>

    </div>


    <!-- 결과 -->
    <div
      id="resultSection"
      class="card hidden"
    >

      <div class="row" style="justify-content:space-between;">
        <h2>참가 결과</h2>

        <button
          class="btn-success"
          onclick="downloadExcel()"
        >
          엑셀 다운로드
        </button>
      </div>

      <div id="resultList"></div>

    </div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    collection,
    getDocs
  }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /*
  =====================================================
  Firebase 설정
  =====================================================
  */

  const firebaseConfig = {

    apiKey: "AIzaSyDJuaH028Hw0jbHVekhSY8hrzlmsVgHpqI",

    authDomain: "icquizgame.firebaseapp.com",

    projectId: "icquizgame",

    storageBucket: "icquizgame.firebasestorage.app",

    messagingSenderId: "987272482834",

    appId: "1:987272482834:web:612b4edb47aae69ac848cb"

  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  /*
  =====================================================
  관리자 설정
  =====================================================
  */

  const ADMIN_PASSWORD = "ISH2801";

  const MASTER_KEY = "ISH2801";


  let current = null;
  let currentResults = [];


  const $ = id => document.getElementById(id);


  /*
  =====================================================
  기본 문제
  =====================================================
  */

  const DEFAULT_QUESTIONS = [
    {
      id: makeId("q"),
      text: "격리주의에 대한 기본적인 설명으로 가장 적절한 것은?",
      options: [
        {
          id: makeId("o"),
          text: "감염 전파를 예방하기 위한 조치"
        },
        {
          id: makeId("o"),
          text: "환자의 식사를 제한하는 조치"
        },
        {
          id: makeId("o"),
          text: "환자의 이동을 무조건 금지하는 조치"
        },
        {
          id: makeId("o"),
          text: "의료진의 업무를 줄이기 위한 조치"
        }
      ],
      answerId: "",
      correct: "",
      points: 100,
      explain: "",

      /*
        시간 제한
        0 = 제한 없음
      */
      timeLimit: 0
    }
  ];


  function makeId(prefix) {
    return prefix + "_" + Math.random().toString(36).substring(2, 10);
  }


  /*
  =====================================================
  로그인
  =====================================================
  */

  window.adminLogin = function() {

    const password = $("adminPassword").value;

    if (password !== ADMIN_PASSWORD) {
      alert("관리자 비밀번호가 올바르지 않습니다.");
      return;
    }

    $("loginSection").classList.add("hidden");
    $("adminSection").classList.remove("hidden");

    loadSessions();
  };


  /*
  =====================================================
  참가 코드 생성
  =====================================================
  */

  function generateParticipantCode() {

    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (let i = 0; i < 6; i++) {
      code += chars[
        Math.floor(Math.random() * chars.length)
      ];
    }

    return code;
  }


  /*
  =====================================================
  세션 목록
  =====================================================
  */

  async function loadSessions() {

    const list = $("sessionList");

    list.innerHTML = "불러오는 중...";

    try {

      const snap = await getDocs(
        collection(db, "sessions")
      );

      const sessions = [];

      snap.forEach(docSnap => {

        sessions.push({
          id: docSnap.id,
          ...docSnap.data()
        });

      });


      sessions.sort((a, b) =>
        String(b.createdAt || "")
          .localeCompare(String(a.createdAt || ""))
      );


      if (sessions.length === 0) {

        list.innerHTML = `
          <p>아직 만들어진 퀴즈가 없습니다.</p>
        `;

        return;
      }


      list.innerHTML = sessions.map(session => {

        const statusClass =
          session.status || "draft";

        const statusText =
          statusClass === "open"
            ? "공개"
            : statusClass === "closed"
              ? "종료"
              : "준비중";


        return `
          <div class="session-item">

            <div class="session-title">
              ${escapeHtml(session.title || "제목 없음")}
            </div>

            <div class="session-info">

              참가 코드:
              <strong>
                ${escapeHtml(session.code || "")}
              </strong>

              <br>

              관리 코드:
              <strong>
                ${session.managerCode ? "설정됨" : "미설정"}
              </strong>

              <br>

              상태:
              <span class="status ${statusClass}">
                ${statusText}
              </span>

            </div>

            <div
              class="row"
              style="margin-top:12px;"
            >

              <button
                class="btn-primary small"
                data-code="${escapeAttr(session.code || "")}"
                onclick="openExistingSession(this.dataset.code)"
              >
                관리하기
              </button>

              <button
                class="btn-danger small"
                data-code="${escapeAttr(session.code || "")}"
                onclick="deleteSession(this.dataset.code)"
              >
                삭제
              </button>

            </div>

          </div>
        `;

      }).join("");

    } catch (error) {

      console.error("퀴즈 목록 불러오기 오류:", error);

      list.innerHTML = `
        <p>
          퀴즈 목록을 불러오지 못했습니다.
        </p>
        <p style="color:#dc2626;font-size:13px;">
          ${escapeHtml(error.message || error)}
        </p>
      `;

    }

  }


  /*
  =====================================================
  새 퀴즈
  =====================================================
  */

  window.createNewSession = async function() {

    try {

      let participantCode;

      do {

        participantCode =
          generateParticipantCode();

      } while (
        await sessionExists(participantCode)
      );


      current = {

        code: participantCode,

        title: "",

        managerCode: "",

        status: "draft",

        createdAt:
          new Date().toISOString(),

        questions:
          structuredClone(DEFAULT_QUESTIONS)

      };


      showEditor();

    } catch (error) {

      console.error(
        "새 퀴즈 생성 오류:",
        error
      );

      alert(
        "새 퀴즈를 만들 수 없습니다.\n\n" +
        (error.message || error)
      );

    }

  };


  async function sessionExists(code) {

    const snap = await getDoc(
      doc(db, "sessions", code)
    );

    return snap.exists();

  }


  /*
  =====================================================
  기존 퀴즈 관리하기
  =====================================================
  */

  window.openExistingSession = async function(code) {

    try {

      const snap = await getDoc(
        doc(db, "sessions", code)
      );


      if (!snap.exists()) {

        alert("해당 퀴즈를 찾을 수 없습니다.");

        await loadSessions();

        return;
      }


      const session = snap.data();


      const inputCode =
        prompt(
          "이 퀴즈의 4자리 관리 코드를 입력하세요.\n\n마스터키를 사용하는 경우 마스터키를 입력하세요."
        );


      if (inputCode === null) {
        return;
      }


      const entered =
        inputCode.trim();


      const managerCode =
        String(session.managerCode || "").trim();


      const isMaster =
        entered === MASTER_KEY;


      const isManager =
        managerCode &&
        entered === managerCode;


      if (!isMaster && !isManager) {

        alert("관리 코드가 올바르지 않습니다.");

        return;
      }


      const rawQuestions =
        Array.isArray(session.questions)
          ? session.questions
          : [];


      const needsNormalization =
        rawQuestions.some(
          q =>
            !q ||
            !Array.isArray(q.options) ||
            q.options.length < 2
        );


      current = {

        ...session,

        code:
          session.code || code,

        questions:
          needsNormalization
            ? normalizeQuestions(rawQuestions)
            : rawQuestions

      };


      showEditor();

    } catch (error) {

      console.error(
        "퀴즈 불러오기 오류:",
        error
      );

      alert(
        "퀴즈를 불러오는 중 오류가 발생했습니다.\n\n" +
        (error.message || error)
      );

    }

  };


  /*
  =====================================================
  편집 화면
  =====================================================
  */

  function showEditor() {

    $("editorSection")
      .classList.remove("hidden");

    $("questionSection")
      .classList.remove("hidden");

    $("resultSection")
      .classList.remove("hidden");


    $("sessionTitle").value =
      current.title || "";


    $("sessionCode").value =
      current.code || "";


    $("displayParticipantCode").textContent =
      current.code || "";


    $("managerCode").value =
      current.managerCode || "";


    $("displayManagerCode").textContent =
      current.managerCode || "미설정";


    $("sessionStatus").value =
      current.status || "draft";


    renderQuestions();

    loadResults(current.code);

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  window.closeEditor = function() {

    current = null;

    $("editorSection")
      .classList.add("hidden");

    $("questionSection")
      .classList.add("hidden");

    $("resultSection")
      .classList.add("hidden");

    loadSessions();

  };


  /*
  =====================================================
  퀴즈 저장
  =====================================================
  */

  window.saveSession = async function() {

    if (!current) {

      alert("먼저 퀴즈를 선택해주세요.");

      return;
    }


    const title =
      $("sessionTitle").value.trim();


    const managerCode =
      $("managerCode").value.trim();


    if (!title) {

      alert("퀴즈 제목을 입력해주세요.");

      return;
    }


    if (!/^\d{4}$/.test(managerCode)) {

      alert("관리 코드는 4자리 숫자로 입력해주세요.");

      return;
    }


    current.title =
      title;

    current.managerCode =
      managerCode;

    current.status =
      $("sessionStatus").value;


    try {

      await setDoc(
        doc(db, "sessions", current.code),
        current
      );


      $("displayManagerCode").textContent =
        managerCode;


      alert("퀴즈가 저장되었습니다.");

      await loadSessions();

    } catch (error) {

      console.error(
        "퀴즈 저장 오류:",
        error
      );

      alert(
        "저장 중 오류가 발생했습니다.\n\n" +
        (error.message || error)
      );

    }

  };


  /*
  =====================================================
  문제 정규화
  =====================================================
  */

  function normalizeQuestions(questions) {

    if (!Array.isArray(questions)) {
      return [];
    }


    return questions.map(q => {

      if (
        q &&
        Array.isArray(q.options) &&
        q.options.length >= 2
      ) {

        /*
          기존 문제에 시간 제한 값이 없으면
          제한 없음으로만 보완합니다.
        */

        if (
          q.timeLimit === undefined ||
          q.timeLimit === null
        ) {

          return {
            ...q,
            timeLimit: 0
          };

        }


        return q;

      }


      const oldCorrect =
        q && q.correct
          ? q.correct
          : "";


      const options = [

        {
          id: makeId("o"),
          text: oldCorrect
        },

        {
          id: makeId("o"),
          text: ""
        }

      ];


      return {

        ...(q || {}),

        id:
          q && q.id
            ? q.id
            : makeId("q"),

        text:
          q && q.text
            ? String(q.text)
            : "",

        options,

        answerId:
          q && q.answerId
            ? q.answerId
            : (
                oldCorrect
                  ? options[0].id
                  : ""
              ),

        correct:
          oldCorrect,

        points:
          q && q.points != null
            ? Number(q.points)
            : 100,

        explain:
          q && q.explain
            ? String(q.explain)
            : "",

        timeLimit:
          q && q.timeLimit != null
            ? Number(q.timeLimit)
            : 0

      };

    });

  }


  /*
  =====================================================
  문제 렌더링
  =====================================================
  */

  function renderQuestions() {

    const list =
      $("questionList");


    if (!current.questions.length) {

      list.innerHTML =
        "<p>문제가 없습니다.</p>";

      return;
    }


    list.innerHTML =
      current.questions.map(
        (q, index) => {

          const timeLimit =
            Number(q.timeLimit || 0);


          return `

            <div
              class="question-card"
              data-question-id="${escapeAttr(q.id)}"
            >

              <div class="question-header">

                <strong>
                  문제 ${index + 1}
                </strong>

                <button
                  class="btn-danger small"
                  onclick="removeQuestion('${escapeAttr(q.id)}')"
                >
                  문제 삭제
                </button>

              </div>


              <label>
                문제
              </label>

              <textarea
                class="question-text"
              >${escapeHtml(q.text)}</textarea>


              <label>
                배점
              </label>

              <input
                class="question-points"
                type="number"
                min="0"
                value="${Number(q.points || 100)}"
              />


              <!-- =========================
                   시간 제한
              ========================= -->

              <label>
                시간 제한
              </label>

              <div class="time-limit-row">

                <select
                  class="question-time-limit"
                  data-current-time="${timeLimit}"
                  onchange="handleTimeLimitChange(this)"
                >

                  <option
                    value="0"
                    ${timeLimit === 0 ? "selected" : ""}
                  >
                    제한 없음
                  </option>

                  <option
                    value="10"
                    ${timeLimit === 10 ? "selected" : ""}
                  >
                    10초
                  </option>

                  <option
                    value="20"
                    ${timeLimit === 20 ? "selected" : ""}
                  >
                    20초
                  </option>

                  <option
                    value="30"
                    ${timeLimit === 30 ? "selected" : ""}
                  >
                    30초
                  </option>

                  <option
                    value="60"
                    ${timeLimit === 60 ? "selected" : ""}
                  >
                    60초
                  </option>

                  <option
                    value="90"
                    ${timeLimit === 90 ? "selected" : ""}
                  >
                    90초
                  </option>

                  <option
                    value="120"
                    ${timeLimit === 120 ? "selected" : ""}
                  >
                    120초
                  </option>

                  <option
                    value="custom"
                    ${(
                      timeLimit > 0 &&
                      ![10,20,30,60,90,120]
                        .includes(timeLimit)
                    ) ? "selected" : ""}
                  >
                    직접 입력
                  </option>

                </select>


                <input
                  type="number"
                  min="1"
                  step="1"
                  class="custom-time-input"
                  placeholder="초 입력"
                  value="${
                    (
                      timeLimit > 0 &&
                      ![10,20,30,60,90,120]
                        .includes(timeLimit)
                    )
                      ? timeLimit
                      : ""
                  }"
                  style="${
                    (
                      timeLimit > 0 &&
                      ![10,20,30,60,90,120]
                        .includes(timeLimit)
                    )
                      ? "display:block;"
                      : "display:none;"
                  }"
                />

              </div>

              <div class="time-limit-help">
                제한 없음으로 설정하면 참가자가 원하는 만큼
                문제를 풀 수 있습니다.
              </div>


              <label>
                보기
              </label>


              <div class="options-container">

                ${
                  Array.isArray(q.options)
                    ? q.options.map(
                        (option, optionIndex) => `

                          <div
                            class="option-row"
                            data-option-id="${escapeAttr(option.id)}"
                          >

                            <input
                              type="radio"
                              name="answer-${escapeAttr(q.id)}"
                              ${
                                q.answerId === option.id
                                  ? "checked"
                                  : ""
                              }
                            />

                            <span class="option-label">
                              ${String.fromCharCode(65 + optionIndex)}
                            </span>

                            <input
                              type="text"
                              class="option-text"
                              value="${escapeAttr(option.text)}"
                              placeholder="보기 ${optionIndex + 1}"
                            />

                            <button
                              class="btn-danger small"
                              onclick="removeOption('${escapeAttr(q.id)}','${escapeAttr(option.id)}')"
                            >
                              삭제
                            </button>

                          </div>

                        `
                      ).join("")
                    : ""
                }

              </div>


              <button
                class="btn-secondary small"
                style="margin-top:10px;"
                onclick="addOption('${escapeAttr(q.id)}')"
              >
                + 보기 추가
              </button>


              <label>
                해설
              </label>

              <textarea
                class="question-explain"
                placeholder="정답에 대한 해설"
              >${escapeHtml(q.explain || "")}</textarea>

            </div>

          `;

        }
      ).join("");

  }


  /*
  =====================================================
  시간 제한 선택 변경
  =====================================================
  */

  window.handleTimeLimitChange =
    function(select) {

      const customInput =
        select.parentElement
          .querySelector(".custom-time-input");


      if (
        select.value === "custom"
      ) {

        customInput.style.display =
          "block";

        customInput.focus();

      } else {

        customInput.style.display =
          "none";

        customInput.value = "";

      }

    };


  /*
  =====================================================
  문제 추가
  =====================================================
  */

  window.addQuestion = function() {

    if (!current) {

      alert("먼저 퀴즈를 선택해주세요.");

      return;
    }


    current.questions.push({

      id: makeId("q"),

      text: "",

      options: [
        {
          id: makeId("o"),
          text: ""
        },
        {
          id: makeId("o"),
          text: ""
        },
        {
          id: makeId("o"),
          text: ""
        },
        {
          id: makeId("o"),
          text: ""
        }
      ],

      answerId: "",

      correct: "",

      points: 100,

      explain: "",

      /*
        새 문제의 기본값:
        시간 제한 없음
      */
      timeLimit: 0

    });


    renderQuestions();

  };


  /*
  =====================================================
  문제 삭제
  =====================================================
  */

  window.removeQuestion = function(questionId) {

    if (
      !confirm(
        "이 문제를 삭제할까요?"
      )
    ) {
      return;
    }


    current.questions =
      current.questions.filter(
        q => q.id !== questionId
      );


    renderQuestions();

  };


  /*
  =====================================================
  보기 추가
  =====================================================
  */

  window.addOption = function(questionId) {

    const question =
      current.questions.find(
        q => q.id === questionId
      );


    if (!question) return;


    question.options.push({

      id: makeId("o"),

      text: ""

    });


    renderQuestions();

  };


  /*
  =====================================================
  보기 삭제
  =====================================================
  */

  window.removeOption =
    function(questionId, optionId) {

      const question =
        current.questions.find(
          q => q.id === questionId
        );


      if (!question) return;


      if (question.options.length <= 2) {

        alert(
          "보기는 최소 2개가 필요합니다."
        );

        return;
      }


      if (
        question.answerId === optionId
      ) {

        question.answerId = "";

      }


      question.options =
        question.options.filter(
          o => o.id !== optionId
        );


      renderQuestions();

  };


  /*
  =====================================================
  문제 저장
  =====================================================
  */

  window.saveQuestions = async function() {

    if (!current) {

      alert("먼저 퀴즈를 선택해주세요.");

      return;
    }


    const cards =
      document.querySelectorAll(
        ".question-card"
      );


    cards.forEach(card => {

      const questionId =
        card.dataset.questionId;


      const question =
        current.questions.find(
          q => q.id === questionId
        );


      if (!question) return;


      question.text =
        card
          .querySelector(".question-text")
          .value.trim();


      question.points =
        Number(
          card
            .querySelector(".question-points")
            .value || 0
        );


      /*
      =================================================
      시간 제한 저장
      =================================================
      */

      const timeLimitSelect =
        card.querySelector(
          ".question-time-limit"
        );


      const customTimeInput =
        card.querySelector(
          ".custom-time-input"
        );


      let timeLimit = 0;


      if (
        timeLimitSelect.value === "custom"
      ) {

        timeLimit =
          Number(
            customTimeInput.value || 0
          );

      } else {

        timeLimit =
          Number(
            timeLimitSelect.value || 0
          );

      }


      /*
        잘못된 값 방지
      */

      if (
        !Number.isFinite(timeLimit) ||
        timeLimit < 0
      ) {

        timeLimit = 0;

      }


      timeLimit =
        Math.floor(timeLimit);


      question.timeLimit =
        timeLimit;


      /*
      =================================================
      보기 저장
      =================================================
      */

      const optionRows =
        card.querySelectorAll(
          ".option-row"
        );


      question.options =
        Array.from(optionRows).map(
          row => {

            const id =
              row.dataset.optionId;

            const text =
              row
                .querySelector(".option-text")
                .value.trim();


            return {
              id,
              text
            };

          }
        );


      const checked =
        card.querySelector(
          'input[type="radio"]:checked'
        );


      question.answerId =
        checked
          ? checked.closest(".option-row").dataset.optionId
          : "";


      const answerOption =
        question.options.find(
          o => o.id === question.answerId
        );


      question.correct =
        answerOption
          ? answerOption.text
          : "";


      question.explain =
        card
          .querySelector(".question-explain")
          .value.trim();

    });


    try {

      await setDoc(
        doc(db, "sessions", current.code),
        current
      );


      alert(
        "문제가 저장되었습니다."
      );


      await loadResults(
        current.code
      );

    } catch (error) {

      console.error(
        "문제 저장 오류:",
        error
      );

      alert(
        "문제 저장 중 오류가 발생했습니다.\n\n" +
        (error.message || error)
      );

    }

  };


  /*
  =====================================================
  결과 불러오기
  =====================================================
  */

  async function loadResults(code) {

    const list =
      $("resultList");


    list.innerHTML =
      "결과를 불러오는 중...";


    try {

      const snap =
        await getDocs(
          collection(
            db,
            "sessions",
            code,
            "results"
          )
        );


      currentResults = [];


      snap.forEach(docSnap => {

        currentResults.push({

          id: docSnap.id,

          ...docSnap.data()

        });

      });


      currentResults.sort(
        (a, b) =>
          String(
            b.createdAt || ""
          ).localeCompare(
            String(
              a.createdAt || ""
            )
          )
      );


      renderResults();

    } catch (error) {

      console.error(
        "결과 불러오기 오류:",
        error
      );

      list.innerHTML = `
        <p>결과를 불러오지 못했습니다.</p>
        <p style="color:#dc2626;font-size:13px;">
          ${escapeHtml(error.message || error)}
        </p>
      `;

    }

  }


  /*
  =====================================================
  결과 표시
  =====================================================
  */

  function renderResults() {

    const list =
      $("resultList");


    if (!currentResults.length) {

      list.innerHTML =
        "<p>아직 참가 결과가 없습니다.</p>";

      return;
    }


    list.innerHTML = `

      <table class="result-table">

        <thead>

          <tr>

            <th>이름</th>

            <th>소속</th>

            <th>점수</th>

            <th>제출시간</th>

          </tr>

        </thead>

        <tbody>

          ${
            currentResults.map(
              result => `

                <tr>

                  <td>
                    ${escapeHtml(
                      result.name || ""
                    )}
                  </td>

                  <td>
                    ${escapeHtml(
                      result.affiliation || ""
                    )}
                  </td>

                  <td>
                    ${Number(
                      result.score || 0
                    )}
                  </td>

                  <td>
                    ${escapeHtml(
                      result.createdAt || ""
                    )}
                  </td>

                </tr>

              `
            ).join("")
          }

        </tbody>

      </table>

    `;

  }


  /*
  =====================================================
  현재 퀴즈 삭제
  =====================================================
  */

  window.deleteCurrentSession =
    async function() {

      if (!current) return;

      await deleteSession(
        current.code
      );

    };


  /*
  =====================================================
  퀴즈 삭제
  =====================================================
  */

  window.deleteSession =
    async function(sessionCode) {

      try {

        const snap =
          await getDoc(
            doc(db, "sessions", sessionCode)
          );


        if (!snap.exists()) {

          alert(
            "이미 삭제된 퀴즈입니다."
          );

          await loadSessions();

          return;
        }


        const session =
          snap.data();


        const confirmed =
          confirm(
            `"${session.title || "제목 없음"}" 퀴즈를 삭제할까요?\n\n참가 코드: ${sessionCode}\n\n삭제하면 되돌릴 수 없습니다.`
          );


        if (!confirmed) {
          return;
        }


        await deleteDoc(
          doc(
            db,
            "sessions",
            sessionCode
          )
        );


        alert(
          "퀴즈가 삭제되었습니다."
        );


        if (
          current &&
          current.code === sessionCode
        ) {

          current = null;

          $("editorSection")
            .classList.add("hidden");

          $("questionSection")
            .classList.add("hidden");

          $("resultSection")
            .classList.add("hidden");

        }


        await loadSessions();

      } catch (error) {

        console.error(
          "퀴즈 삭제 오류:",
          error
        );

        alert(
          "퀴즈 삭제 중 오류가 발생했습니다.\n\n" +
          (error.message || error)
        );

      }

    };


  /*
  =====================================================
  엑셀 다운로드
  =====================================================
  */

  window.downloadExcel =
    function() {

      if (!currentResults.length) {

        alert(
          "다운로드할 결과가 없습니다."
        );

        return;
      }


      const headers = [
        "이름",
        "소속",
        "점수",
        "제출시간"
      ];


      const rows =
        currentResults.map(
          result => [

            result.name || "",

            result.affiliation || "",

            result.score || 0,

            result.createdAt || ""

          ]
        );


      const csv = [

        headers,

        ...rows

      ]
      .map(
        row =>
          row.map(
            value =>
              `"${String(value)
                .replace(/"/g, '""')}"`
          ).join(",")
      )
      .join("\n");


      const blob =
        new Blob(
          ["\ufeff" + csv],
          {
            type:
              "text/csv;charset=utf-8;"
          }
        );


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement("a");


      a.href = url;

      a.download =
        `${current.title || "퀴즈"}_결과.csv`;

      a.click();


      URL.revokeObjectURL(url);

    };


  /*
  =====================================================
  유틸
  =====================================================
  */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttr(value) {

    return escapeHtml(value);

  }


</script>
